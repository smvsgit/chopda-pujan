<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A0A00">
    <title>SMVS - Chopda-Pujan Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Trimmed from nine weights plus a second family to the three weights
         actually used. Font payload blocks first paint on weak connections. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --saffron-deep:#8B1A00;--saffron:#D4380D;--saffron-light:#FF6B35;
            --gold:#DAA520;--gold-light:#FFD700;--gold-pale:#FFF3C4;
            --cream:#FFFAF0;--cream-dark:#F5E6D3;
            --brown-deep:#1A0A00;--brown:#3E2723;--brown-mid:#5D4037;--brown-light:#6D5147;
        }
        body{font-family:'Noto Sans Gujarati',sans-serif;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--brown-deep);overflow:hidden;position:relative}
        .particles{position:fixed;inset:0;pointer-events:none;z-index:0}
        .particle{position:absolute;width:4px;height:4px;background:var(--gold-light);border-radius:50%;animation:float-up linear infinite;opacity:0}
        @keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-10vh) scale(1);opacity:0}}
        .temple-bg{position:fixed;bottom:0;left:0;right:0;height:40vh;background:linear-gradient(to top,rgba(139,26,0,.3),transparent);z-index:0}
        .login-container{position:relative;z-index:10;width:100%;max-width:440px;padding:20px}
        .login-card{background:linear-gradient(145deg,rgba(255,250,240,.97),rgba(245,230,211,.95));border-radius:24px;padding:44px 36px 40px;box-shadow:0 0 0 1px rgba(218,165,32,.3),0 25px 60px rgba(0,0,0,.5),0 0 100px rgba(212,56,13,.15),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(20px);position:relative;overflow:hidden}
        .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--saffron-deep),var(--gold),var(--saffron-light),var(--gold),var(--saffron-deep));background-size:200% 100%;animation:shimmer 3s ease infinite}
        @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

        .logo-container{text-align:center;margin-bottom:6px}
        .logo-container img{height:80px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(139,26,0,.2))}

        .org-name{text-align:center;font-size:30px;font-weight:800;color:var(--saffron-deep);letter-spacing:3px;margin-bottom:4px}
        .org-subtitle{text-align:center;font-size:14px;font-weight:400;color:var(--brown-mid);margin-bottom:24px;letter-spacing:.5px}

        
        .form-group{margin-bottom:18px;position:relative}
        .form-group label{display:block;font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px}
        .input-wrapper{position:relative}
        .input-wrapper i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--brown-light);font-size:16px;transition:color .3s;pointer-events:none}
        .form-group input{width:100%;padding:12px 14px 12px 44px;border:2px solid var(--cream-dark);border-radius:12px;font-size:16px;font-family:inherit;color:var(--brown-deep);background:rgba(255,255,255,.7);transition:all .3s;outline:none}
        .form-group input:focus{border-color:var(--saffron);background:#fff;box-shadow:0 0 0 4px rgba(212,56,13,.1)}
        .input-wrapper:has(input:focus) i{color:var(--saffron)}

        .btn-login{width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--saffron-deep),var(--saffron),var(--saffron-light));cursor:pointer;transition:all .3s;position:relative;overflow:hidden;letter-spacing:1px;margin-top:8px}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(212,56,13,.4)}
        .btn-login:active{transform:translateY(0)}
        .btn-login:disabled{opacity:.7;cursor:wait;transform:none}

        .error-msg{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;animation:shake .4s ease}
        .error-msg.show{display:block}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

        .footer-text{text-align:center;margin-top:24px;font-size:12px;color:var(--brown-light)}
        .loading-spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
        @keyframes spin{to{transform:rotate(360deg)}}

        button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

        @media(max-width:480px){.login-card{padding:36px 24px 32px}.org-name{font-size:24px}.logo-container img{height:60px}}
        @media(prefers-reduced-motion:reduce){
            *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
            .particles{display:none}
        }
    </style>
</head>
<body>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="temple-bg" aria-hidden="true"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="/static/logo.png" alt="SMVS" onerror="this.style.display='none'">
            </div>
            <div class="org-name">SMVS</div>
            <div class="org-subtitle">Chopda-Pujan Management System</div>

            <div class="error-msg" id="errorMsg" role="alert"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter username">
                        <i class="fas fa-user" aria-hidden="true"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    <span id="btnText">Log in</span>
                    <div class="loading-spinner" id="spinner"></div>
                </button>
            </form>
            <div class="footer-text">જય સ્વામિનારાયણ | Jay Swaminarayan</div>
        </div>
    </div>
    <script>
        // Injected by Flask-WTF. Every write request must carry this token.
        const CSRF_TOKEN = '{{ csrf_token() }}';

        const OFFLINE_MSG = 'Cannot reach the server. Check your connection.';

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            const particlesEl = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (4 + Math.random() * 6) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
                particlesEl.appendChild(p);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.remove('show');
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.disabled = true;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                let data = null;
                try { data = await res.json(); } catch (err) { data = null; }
                if (res.ok) {
                    window.location.href = '/app';
                    return;
                }
                errorMsg.textContent = (data && data.error) || OFFLINE_MSG;
                errorMsg.classList.add('show');
            } catch (err) {
                errorMsg.textContent = OFFLINE_MSG;
                errorMsg.classList.add('show');
            } finally {
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
