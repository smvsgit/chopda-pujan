    };

    // The signed-in user's choice, with the server's default behind it. The
    // account value used to be interpolated on its own, which rendered the
    // string "None" when the column was empty - and "None" is not a key in T,
    // so every label fell back to its raw key.
    let LANG = '{{ user.language or default_language }}';
    if (LANG !== 'en' && LANG !== 'gu') LANG = 'en';
    function t(key) { return (T[key] && T[key][LANG]) || key; }

    // One place that puts the interface into a language, so the header button,
    // the instruction gate and the help dialog cannot drift apart.
    //
    // The save goes through api(), which sends the CSRF header. The old plain
    // fetch() here had none, so CSRFProtect rejected it: the language changed
    // on screen and was never stored, and the next sign-in came back in
    // whatever the account was created with.
    function applyLang(next, redraw) {
        LANG = next === 'gu' ? 'gu' : 'en';
        const lab = document.getElementById('langLabel');
        if (lab) lab.textContent = LANG === 'en' ? '\u0A97\u0AC1' : 'EN';
        document.querySelectorAll('[data-t]').forEach(el => { const key = el.dataset.t; if (T[key]) el.textContent = T[key][LANG]; });
        updateUserRoleLabel();
        const saved = api('/api/set-language', 'POST', {language: LANG}, true);
        if (redraw !== false) navigateTo(currentPage);
        return saved;
    }
    function toggleLang() { applyLang(LANG === 'en' ? 'gu' : 'en'); }

    const USER = {{ user | tojson }};
    const ROLES = USER.role;
    const CURRENT_YEAR = new Date().getFullYear();
    // Five years back to one ahead: enough to catch up on old collections and
    // to carry a pledge into next year.
    const YEAR_LIST = Array.from({length:7},(_,i)=>CURRENT_YEAR+1-i);
    const YEAR_OPTS = (sel)=>YEAR_LIST.map(y=>'<option value="'+y+'" '+(y===sel?'selected':'')+'>'+y+'</option>').join('');

    // The line under the name in the sidebar: whether they are a Team Member
    // or based at a centre, then the post they hold.
    function updateUserRoleLabel() {
        const el = document.getElementById('userRoleLabel');
        if (!el) return;
        const where = (USER.user_type === 'team_member' || !USER.center_name)
            ? t('team_member')
            : USER.center_name;
        const post = USER.role_name || USER.role || '';
        el.textContent = post ? where + ' \u2022 ' + post : where;
    }

    let currentPage = 'dashboard';

    // The first sidebar entry this user can open. Reads the DOM so it always
    // matches whatever the menu is showing.
    function showNoAccess(){
        const body=document.getElementById('pageBody');
        if(body) body.innerHTML='<div class="card"><div class="card-body text-center py-4">'
            +'<i class="fas fa-lock" style="font-size:34px;color:var(--brown-light)"></i>'
            +'<h3 style="margin:12px 0 6px">'+t('no_access_title')+'</h3>'
            +'<p class="text-muted">'+t('no_access_body')+'</p></div></div>';
        const title=document.getElementById('pageTitle');
        if(title) title.textContent=t('no_access_title');
    }

    // ---- A password of your own ---------------------------------------
    // The seeded passwords are written down in the repository, so an account
    // still using one is open to anybody who has read it. This is held in
    // front of everything until it is changed.
    async function showPasswordGate(){
        const st = await api('/api/password/status', 'GET', null, true);
        if (!st || !st.must_change) return;
        return new Promise(resolve => {
            const box = document.createElement('div');
            box.className = 'instr-gate';
            document.body.appendChild(box);
            document.body.classList.add('instr-open');
            box.innerHTML =
              '<div class="instr-card pw-card">'
              +'<div class="instr-head"><div>'
                +'<h2>'+t('pw_title')+'</h2>'
                +'<small>'+t('pw_sub')+'</small></div></div>'
              +'<div class="instr-body">'
                +'<p>'+t('pw_why')+'</p>'
                +'<div class="form-group"><label>'+t('pw_current')+' *</label>'
                  +'<input type="password" id="pwCur" autocomplete="current-password"></div>'
                +'<div class="form-group"><label>'+t('pw_new')+' *</label>'
                  +'<input type="password" id="pwNew" autocomplete="new-password"></div>'
                +'<div class="form-group"><label>'+t('pw_again')+' *</label>'
                  +'<input type="password" id="pwNew2" autocomplete="new-password"></div>'
                +'<small class="field-hint">'+t('pw_rules')+'</small>'
                +'<div id="pwMsg"></div>'
              +'</div>'
              +'<div class="instr-foot">'
                +'<small class="text-muted">'+t('pw_no_skip')+'</small>'
                +'<div class="instr-actions">'
                  +'<button type="button" class="btn btn-primary" id="pwSave" onclick="submitPasswordGate()">'
                    +'<i class="fas fa-key"></i> '+t('pw_save')+'</button></div>'
              +'</div></div>';
            setTimeout(()=>document.getElementById('pwCur')?.focus(), 80);

            window.submitPasswordGate = async () => {
                const cur=document.getElementById('pwCur').value;
                const nw=document.getElementById('pwNew').value;
                const nw2=document.getElementById('pwNew2').value;
                const msg=document.getElementById('pwMsg');
                const fail=txt=>{ msg.innerHTML='<div class="io-status err">'+esc(txt)+'</div>'; };
                if(!cur||!nw){ fail(t('pw_fill_both')); return; }
                if(nw!==nw2){ fail(t('pw_mismatch')); return; }
                const btn=document.getElementById('pwSave');
                btn.disabled=true;
                const res=await api('/api/password/change','POST',{current:cur,new:nw},true);
                btn.disabled=false;
                if(!res||res.error){ fail((res&&res.error)||t('error')); return; }
                box.remove();
                document.body.classList.remove('instr-open');
                toast(t('pw_done'));
                resolve();
            };
        });
    }

    // ---- Instructions ------------------------------------------------
    // Read-and-accept pages, chosen by the user's type, role and rights. Held
    // in front of the app rather than shown as a dismissable notice: an
    // instruction nobody reads is worse than none, because everyone assumes
    // it was read.
    async function showInstructionGate(){
        const d = await api('/api/instructions/pending', 'GET', null, true);
        if (!d || !d.rows || !d.rows.length) return;
        return new Promise(resolve => {
            let at = 0;
            const pages = d.rows;
            const box = document.createElement('div');
            box.className = 'instr-gate';
            document.body.appendChild(box);
            document.body.classList.add('instr-open');

            function draw(){
                const p = pages[at];
                box.innerHTML =
                  '<div class="instr-card">'
                  +'<div class="instr-head">'
                    +'<div><h2>'+esc(docText(p,'title'))+'</h2>'
                      +'<small>'+t('instr_step').replace('{n}',at+1).replace('{t}',pages.length)+'</small></div>'
                    +'<button type="button" class="instr-lang" onclick="instrToggleLang()">'
                      +(LANG==='en'?'\u0A97\u0AC1':'EN')+'</button>'
                  +'</div>'
                  +'<div class="instr-body" id="instrBody">'+docText(p,'body')+'</div>'
                  +'<div class="instr-listen"><button type="button" class="btn btn-sm btn-outline" '
                    +'onclick="listenInstruction(-1)"><i class="fas fa-headphones"></i> '
                    +t('listen')+'</button></div>'
                  +'<div class="instr-foot">'
                    +'<label class="check-inline"><input type="checkbox" id="instrTick" '
                      +'onchange="document.getElementById(\'instrNext\').disabled=!this.checked"> '
                      +t('instr_accept')+'</label>'
                    +'<div class="instr-actions">'
                      +(at>0?'<button type="button" class="btn btn-outline" onclick="instrBack()">'+t('back')+'</button>':'')
                      +'<button type="button" class="btn btn-primary" id="instrNext" disabled onclick="instrNext()">'
                        +(at===pages.length-1?t('instr_finish'):t('instr_next'))+'</button>'
                    +'</div>'
                  +'</div></div>';
                // Scrolled to the top each time, so nobody accepts page three
                // while still looking at the bottom of page two.
                document.getElementById('instrBody').scrollTop = 0;
            }

            window.instrBack = () => { at = Math.max(0, at-1); draw(); };
            // Both languages already came down with the page, so switching is
            // a redraw rather than a fetch - and it cannot lose the reader's
            // place if the network is slow.
            window.instrToggleLang = () => {
                applyLang(LANG === 'en' ? 'gu' : 'en', false);
                draw();
            };
            window.instrNext = async () => {
                const p = pages[at];
                const res = await api('/api/instructions/accept','POST',{ids:[p.id]});
                if (!res) return;
                if (at < pages.length-1) { at++; draw(); return; }
                box.remove();
                document.body.classList.remove('instr-open');
                // Retranslate the shell, in case the language was switched
                // while reading.
                document.querySelectorAll('[data-t]').forEach(el=>{
                    const k=el.dataset.t; if(T[k]) el.textContent=T[k][LANG];
                });
                resolve();
            };
            draw();
        });
    }

    // ---- Reading aloud -----------------------------------------------
    // The browser can speak but cannot get text out of a PDF, so the text
    // comes from the server a page at a time and is spoken here. This is what
    // makes a manual usable by somebody who cannot easily read a screen -
    // which is a good part of who these are written for.
    let _sayTimer = null;

    function speechReady(){
        return typeof window.speechSynthesis !== 'undefined'
            && typeof window.SpeechSynthesisUtterance !== 'undefined';
    }

    // The closest voice to the language being read. Gujarati voices are not
    // installed everywhere; Hindi is a far better fallback than English for
    // Gujarati text, and the default voice is the last resort.
    function pickVoice(lang){
        const all = window.speechSynthesis.getVoices() || [];
        const want = lang === 'gu' ? ['gu-in', 'gu', 'hi-in', 'hi'] : ['en-in', 'en-gb', 'en'];
        for (const tag of want){
            const hit = all.find(v => (v.lang || '').toLowerCase().replace('_', '-')
                                       .startsWith(tag));
            if (hit) return hit;
        }
        return null;
    }

    function stopListening(){
        clearTimeout(_sayTimer); _sayTimer = null;
        if (speechReady()) window.speechSynthesis.cancel();
        const bar = document.getElementById('sayBar');
        if (bar) bar.remove();
    }

    async function listenManual(id, page){
        if (!speechReady()){ toast(t('listen_none'), 'error'); return; }
        stopListening();
        const lang = LANG;
        const d = await api('/manual/' + id + '/text?lang=' + lang + '&page=' + page,
                            'GET', null, true);
        if (!d || !d.text){
            toast((api.lastError) || t('no_data'), 'error');
            return;
        }
        const voice = pickVoice(lang);
        sayBar(id, d, !voice && lang === 'gu');
        const say = new SpeechSynthesisUtterance(d.text);
        if (voice) say.voice = voice;
        say.lang = voice ? voice.lang : (lang === 'gu' ? 'gu-IN' : 'en-IN');
        // A shade slower than default: these are instructions, not a story,
        // and they are being followed while listening.
        say.rate = 0.92;
        // Straight on to the next page, so somebody listening does not have to
        // reach for the screen between pages.
        say.onend = () => {
            if (d.page < d.pages)
                _sayTimer = setTimeout(() => listenManual(id, d.page + 1), 400);
            else
                stopListening();
        };
        window.speechSynthesis.speak(say);
    }

    // A strip at the foot of the dialog: which page is being read, and a way
    // to stop. Kept outside the manual list so re-rendering the list does not
    // silence it.
    function sayBar(id, d, noVoice){
        let bar = document.getElementById('sayBar');
        if (!bar){
            bar = document.createElement('div');
            bar.id = 'sayBar';
            bar.className = 'say-bar';
            (document.getElementById('modalBody') || document.body).appendChild(bar);
        }
        bar.innerHTML =
          '<i class="fas fa-volume-high" aria-hidden="true"></i>'
          +'<div><strong>'+t('listening')+'</strong>'
            +'<span>'+t('listen_page').replace('{n}', d.page).replace('{t}', d.pages)
            +(d.served_gu?' \u2022 '+t('gu_edition'):'')
            +(noVoice?' \u2022 '+t('listen_no_voice'):'')+'</span></div>'
          +'<button type="button" class="btn btn-sm btn-outline" onclick="stopListening()">'
            +'<i class="fas fa-stop"></i> '+t('stop_listen')+'</button>';
    }

    // An instruction page is already text on the screen, so it is spoken from
    // there rather than fetched again.
    function listenInstruction(i){
        if (!speechReady()){ toast(t('listen_none'), 'error'); return; }
        stopListening();
        const el = document.getElementById('instrDetail' + i);
        const src = el || document.querySelector('#instrBody');
        if (!src) return;
        const text = (src.textContent || '').replace(/\s{2,}/g, ' ').trim();
        if (!text) return;
        const voice = pickVoice(LANG);
        sayBar(0, {page: 1, pages: 1, served_gu: LANG === 'gu'},
               !voice && LANG === 'gu');
        const say = new SpeechSynthesisUtterance(text);
        if (voice) say.voice = voice;
        say.lang = voice ? voice.lang : (LANG === 'gu' ? 'gu-IN' : 'en-IN');
        say.rate = 0.92;
        say.onend = stopListening;
        window.speechSynthesis.speak(say);
    }

    // Rereading them afterwards, and the manual, from the same place. Two tabs
    // rather than two menu entries: a volunteer looking for "how do I do this"
    // does not know whether the answer is an instruction or a manual page.
    let _helpTab = 'instructions';

    // Every instruction page and manual arrives with both languages in it
    // (title_en/title_gu, body_en/body_gu, about_en/about_gu), so the dialog
    // can offer the choice itself instead of showing whatever the account
    // happens to be set to. Gujarati left blank falls back to English rather
    // than to an empty panel.
    function docText(o, base){
        if (!o) return '';
        const gu = o[base+'_gu'], en = o[base+'_en'];
        if (LANG === 'gu') return gu || en || o[base] || '';
        return en || gu || o[base] || '';
    }

    async function showMyInstructions(tab){
        _helpTab = tab || 'instructions';
        const [ins, man] = await Promise.all([
            api('/api/instructions/mine', 'GET', null, true),

        ]);
        window._helpIns = (ins && ins.rows) || [];

                   +t('instructions')+'</button>':'')

                   +t('user_manual')+'</button>':'')
            +'</div>'

            +'</div>'
          +'</div><div id="helpBody"></div>', 'wide');

    function setHelpTab(k){ _helpTab = k; renderHelpTab(); }

    // Reading in a language and working in it are the same wish often enough
    // that this moves the whole interface, and records the choice, rather than
    // leaving a dialog in one language and the screen behind it in another.
    function setHelpLang(l){
        if (l === LANG) return;
        applyLang(l, false);
        const ttl = document.getElementById('modalTitle');
        if (ttl) ttl.textContent = t('instr_manual');
        renderHelpTab();
    }

                      +(m.serves_gu?m.size_gu_kb:m.size_kb)+' KB'
                      +(m.version?' \u2022 '+esc(m.serves_gu?(m.version_gu||m.version):m.version):'')
                      // Which edition this reader is being given. The switch

                      // clear whether the PDF turned over with it.
                      +(m.serves_gu

             +'<strong>'+esc(docText(p,'title'))+'</strong>'
             +(p.accepted_at?'<small class="text-muted"> \u2022 '+t('accepted_on')+' '+esc(p.accepted_at)+'</small>'
                             :'<span class="badge badge-warning">'+t('not_accepted')+'</span>')
             +'<div class="instr-detail" id="instrDetail'+i+'" style="display:none">'+docText(p,'body')
               +'<div class="instr-listen"><button type="button" class="btn btn-sm btn-outline" '
                 +'onclick="listenInstruction('+i+')"><i class="fas fa-headphones"></i> '

           +'</div>').join('')

    // The PDF in the browser's own viewer, inside the dialog. An <object> with
    // a link inside it: if the browser cannot render a PDF - some phones cannot
    // - the fallback link is what shows, rather than a blank grey box.
    function viewManual(id){
        // ?lang follows the switch at the top of the dialog, so turning it to
        // Gujarati turns the document over too where a Gujarati file exists.
        const src = '/manual/'+id+'?lang='+LANG;
        const box = document.getElementById('manualViewer');
        if (!box) { window.open(src, '_blank', 'noopener'); return; }
        box.innerHTML =
          '<div class="pdf-frame">'
            +'<object data="'+src+'#view=FitH" type="application/pdf">'
              +'<div class="pdf-fallback">'
                +'<p>'+t('pdf_no_inline')+'</p>'
                +'<a class="btn btn-primary btn-sm" href="'+src+'" target="_blank" rel="noopener">'
                  +'<i class="fas fa-up-right-from-square"></i> '+t('open_new_tab')+'</a>'
              +'</div>'
            +'</object>'
          +'</div>'
          +'<div class="pdf-actions">'
            +'<a class="btn btn-outline btn-sm" href="/manual/'+id+'" target="_blank" rel="noopener">'
              +'<i class="fas fa-up-right-from-square"></i> '+t('open_new_tab')+'</a>'
          +'</div>';
        // Not present in every webview, and not worth an error if it is missing.
        if (box.scrollIntoView) box.scrollIntoView({behavior:'smooth', block:'nearest'});

    function instrToggle(i, btn){
        const el=document.getElementById('instrDetail'+i);

    async function refreshPermissions(){
        const me = await api('/api/me', 'GET', null, true);
        if (!me || !me.permissions) return;
        let changed = false;
        for (const k of Object.keys(me.permissions)) {
            if (PERMS[k] !== me.permissions[k]) { PERMS[k] = me.permissions[k]; changed = true; }
        }
        if (!changed) return;
        USER.permissions = me.permissions;
        setupNav();                       // the menu follows the new rights
        const page = document.querySelector('.nav-item.active')?.dataset.page;
        if (page && !can('page.' + page)) navigateTo(firstAllowedPage());
    }

    function firstAllowedPage(){
        for (const item of document.querySelectorAll('.nav-item')) {
            const perm = item.dataset.perm;
            if (perm && !can(perm)) continue;
            if (item.style.display === 'none') continue;
            return item.dataset.page;
        }
        return null;
    }

    function setSidebar(open) {
        document.getElementById('sidebar').classList.toggle('open', open);
        document.getElementById('sidebarOverlay').classList.toggle('active', open);
        document.getElementById('hamburgerBtn').setAttribute('aria-expanded', String(open));
        document.body.classList.toggle('nav-open', open);
    }

    function setupNav() {
        document.querySelectorAll('.nav-item').forEach(item => {
            // Permissions decide the menu. data-role is kept only as a
            // fallback for anything not yet tagged with a permission.
            const permReq = item.dataset.perm;
            const roleReq = item.dataset.role;
            if (permReq ? !can(permReq)
                        : (roleReq && !roleReq.split(',').includes(ROLES))) {
                item.style.display = 'none'; return;
            }
            item.addEventListener('click', e => { e.preventDefault(); navigateTo(item.dataset.page); setSidebar(false); });
        });
        document.getElementById('hamburgerBtn').addEventListener('click', () => setSidebar(!document.getElementById('sidebar').classList.contains('open')));
        document.getElementById('sidebarOverlay').addEventListener('click', () => setSidebar(false));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { setSidebar(false); closeModal(); } });
    }

    function navigateTo(page) {
        // A page can be reached by more than the sidebar, so check here too.
        if (!page) { showNoAccess(); return; }
        // Some pages share a permission - Roles is governed by page.users -
        // so the sidebar entry's own data-perm wins when it has one.
        const navItem = document.querySelector('.nav-item[data-page="' + page + '"]');
        const needed = (navItem && navItem.dataset.perm) || ('page.' + page);
        if (!can(needed)) {
            const fallback = firstAllowedPage();
            if (fallback && fallback !== page) { navigateTo(fallback); return; }
            showNoAccess(); return;
        }
        currentPage = page;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const an = document.querySelector('.nav-item[data-page="'+page+'"]');
        if (an) an.classList.add('active');
        document.getElementById('pageTitle').textContent = t('nav_' + page);
        document.getElementById('headerActions').innerHTML = '<button class="btn btn-outline btn-lang" onclick="toggleLang()"><i class="fas fa-language"></i> <span id="langLabel">'+(LANG==='en'?'\u0A97\u0AC1':'EN')+'</span></button>' + getHeaderActions(page);
        document.getElementById('pageBody').innerHTML = '<div class="loading-state"><div class="spinner-large"></div><p>'+t('loading')+'</p></div>';
        // A poll that outlived the screen it belongs to would keep asking the
        // server for a queue nobody is looking at.
        if(_dsTimer){ clearInterval(_dsTimer); _dsTimer=null; }
        stopClock();
        if(_skDarshan){
            _skDarshan=false; _darshanRow=null; _dsQueue=[];
            document.body.classList.remove('sk-darshan-mode','bulk-fullscreen');
        }
        if(page==='members' && can('member.requests'))
            setTimeout(refreshMrBadge, 300);
        const loaders = { dashboard:loadDashboard, centers:loadCenters, members:loadMembers, sankalps:loadSankalps, collections:loadCollections, passes:loadPasses, attendance:loadAttendance, reports:loadReports, users:loadUsers, roles:loadRoles, communication:loadCommunication, audit:loadAudit };
        if (loaders[page]) loaders[page]();
    }

                    + ((can('notify.whatsapp')||can('notify.sms')||can('notify.email'))

        return (fastBtns[page]||'')+(extraBtns[page]||'')+ie+(m[page] || '');

    const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').content;

    // What this user may do. The server sends it and enforces the same list,
    // so a hidden button is convenience rather than the security boundary.
    const PERMS = (USER && USER.permissions) || {};
    function can(key){ return PERMS[key] === true; }
    // A template carries both names; which one shows follows the interface
    // language, falling back when the Gujarati name has not been filled in.
    function tplName(x){
        return (LANG==='gu' && x && x.name_gu) ? x.name_gu : (x ? x.name : '');
    }
    // Each money figure has its own right. A figure the server withheld comes
    // back as null, so the cell shows a dash rather than a misleading zero.
    const MONEY = {
        sankalp:  ()=>can('finance.sankalp'),
        collected:()=>can('finance.collected'),
        pending:  ()=>can('finance.pending'),
        dharmada: ()=>can('finance.dharmada')
    };
    function money(v){ return (v===null||v===undefined)?'\u2014':fmt(v); }

    // `quiet` suppresses the error toast, for callers that show the message
    // themselves - otherwise the same failure is reported twice, in two
    // different words, in two places on the screen.
    async function api(url, method='GET', data=null, quiet=false) {
        const opts = { method, headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN } };
        if (data) opts.body = JSON.stringify(data);
        let res;
        try {
            res = await fetch(url, opts);
        } catch (err) {
            toast(t('network_error'), 'error');
            return null;
        }
        if (res.status === 401) { window.location.href = '/login'; return null; }
        let json = null;
        try { json = await res.json(); } catch (err) { json = null; }
        if (!res.ok) {
            if (!quiet) toast((json && json.error) || t('server_error'), 'error');
            api.lastError = (json && json.error) || t('server_error');
            return null;
        }
        api.lastError = null;
        return json;
    }
    // Identical messages are not stacked. The scanner used to fire the same
    // "Already checked in" many times a second; now the first one shows and
    // later ones just restart its timer.
    const _toastSeen = new Map();
    function toast(msg,type='success'){
        const c=document.getElementById('toastContainer');
        const key=type+'|'+msg;
        const prev=_toastSeen.get(key);
        if(prev && prev.el.isConnected){
            clearTimeout(prev.timer);
            prev.el.classList.remove('toast-out');
            prev.count=(prev.count||1)+1;
            let badge=prev.el.querySelector('.toast-count');
            if(prev.count>1){
                if(!badge){ badge=document.createElement('b'); badge.className='toast-count'; prev.el.appendChild(badge); }
                badge.textContent='\u00d7'+prev.count;
            }
            prev.timer=setTimeout(()=>{prev.el.classList.add('toast-out');
                setTimeout(()=>{prev.el.remove();_toastSeen.delete(key);},300);},3200);
            return;
        }
        const el=document.createElement('div');
        el.className='toast toast-'+type;
        el.setAttribute('role', type==='error' ? 'alert' : 'status');
        const icons={success:'check-circle',error:'exclamation-circle',warning:'exclamation-triangle',info:'info-circle'};
        const ic=document.createElement('i'); ic.className='fas fa-'+(icons[type]||'info-circle'); ic.setAttribute('aria-hidden','true');
        const sp=document.createElement('span'); sp.textContent=msg;   // textContent, never innerHTML
        el.appendChild(ic); el.appendChild(sp);
        c.appendChild(el);
        const rec={el:el,count:1,timer:null};
        rec.timer=setTimeout(()=>{el.classList.add('toast-out');
            setTimeout(()=>{el.remove();_toastSeen.delete(key);},300);},3200);
        _toastSeen.set(key,rec);
    }
    function openModal(title,body,size){

    // ======================== SORTABLE / PAGED TABLES ========================
    // Applied to any <table class="sortable">. Click a header to sort; add
    // data-page="10" for pagination. Both work on the rendered rows, so no
    // extra round trip to the server.
    //
    // Printing always emits EVERY row, not just the visible page - a report
    // that silently prints 10 of 200 rows would be worse than no report.
    function enhanceTables(root){
        (root||document).querySelectorAll('table.sortable').forEach(tbl=>{
            if(tbl._enhanced){
                // The page repainted the body (a filter, a search, a reload).
                // The cached rows are stale, so take them again and re-apply
                // whatever sort was in force.
                const body=tbl.tBodies[0];
                if(!body) return;
                const cur=Array.from(body.rows);
                const same = tbl._domRows && cur.length===tbl._domRows.length
                             && cur.every((r,i)=>r===tbl._domRows[i]);
                if(same) return;                  // we put those rows there
                tbl._rows=cur;
                tbl._page=1;
                if(tbl._sortCol>=0){
                    tbl._asc=!tbl._asc;           // sortTable flips it back
                    sortTable(tbl, tbl._sortCol, tbl._sortKind||'text');
                } else {
                    applyDefaultSort(tbl);
                }
                return;
            }
            tbl._enhanced=true;
            const tbody=tbl.tBodies[0];
            if(!tbody) return;
            tbl._rows=Array.from(tbody.rows);
            tbl._page=1;
            tbl._per=parseInt(tbl.dataset.page||'0')||0;
            tbl._sortCol=-1; tbl._asc=true;

            Array.from(tbl.tHead?.rows[0]?.cells||[]).forEach((th,idx)=>{
                if(!th.dataset.sort) return;
                th.classList.add('sortable-th');
                th.tabIndex=0;
                th.setAttribute('role','button');
                th.insertAdjacentHTML('beforeend','<i class="fas fa-sort sort-ico" aria-hidden="true"></i>');
                const go=(e)=>sortTable(tbl,idx,th.dataset.sort,!!(e&&(e.shiftKey||e.ctrlKey||e.metaKey)));
                th.addEventListener('click',go);
                th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
            });
            applyDefaultSort(tbl);
        });
    }

    // A table can name the column to open in, via data-default-sort on its
    // header - the pass and sankalp lists open in seat order.
    function applyDefaultSort(tbl){
        const cells=Array.from(tbl.tHead?.rows[0]?.cells||[]);
        const def=cells.findIndex(th=>th.dataset.defaultSort);
        if(def<0){ renderPage(tbl); return; }
        tbl._sortCol=-1;                       // so the first call sorts ascending
        sortTable(tbl, def, cells[def].dataset.sort||'text');
        if(cells[def].dataset.defaultSort==='desc')
            sortTable(tbl, def, cells[def].dataset.sort||'text');
    }

    function cellValue(row,idx,kind){
        const td=row.cells[idx];
        if(!td) return kind==='num'?null:'';
        if(kind==='num'){
            // data-v carries the raw number so "Rs.7,39,000" sorts correctly.
            const raw=td.dataset.v!==undefined?td.dataset.v:td.textContent;
            const n=parseFloat(String(raw).replace(/[^0-9.\-]/g,''));
            return isNaN(n)?null:n;      // null = nothing there
        }
        return td.textContent.trim().toLowerCase();
    }

    // Shift-click (or ctrl-click) adds a level instead of replacing the one in
    // force, so a table can be ordered by centre, then seat, then name. Three
    // levels is the limit; a fourth pushes the oldest out.
    function sortTable(tbl,idx,kind,add){
        tbl._sortKeys = tbl._sortKeys || [];
        if(add){
            const at = tbl._sortKeys.findIndex(k=>k.idx===idx);
            if(at>=0) tbl._sortKeys[at].asc = !tbl._sortKeys[at].asc;
            else tbl._sortKeys.push({idx:idx, kind:kind, asc:true});
            if(tbl._sortKeys.length>3) tbl._sortKeys.shift();
        } else {
            tbl._sortKeys = [{idx:idx, kind:kind,
                asc:(tbl._sortCol===idx) ? !tbl._asc : true}];
        }
        const last = tbl._sortKeys[tbl._sortKeys.length-1];
        tbl._asc=last.asc; tbl._sortCol=idx; tbl._sortKind=kind;
        tbl._rows.sort((a,b)=>{
            // Each level in turn; the first that separates the two rows wins.
            for(const k of tbl._sortKeys){
                const dir = k.asc?1:-1;
                const x=cellValue(a,k.idx,k.kind), y=cellValue(b,k.idx,k.kind);
                // Rows with nothing in the column always sink to the bottom, in
                // either direction - sorting by Seat No. should show the seats,
                // not two hundred dashes.
                const xb=(x===null||x===''), yb=(y===null||y==='');
                if(xb&&yb) continue;
                if(xb) return 1;
                if(yb) return -1;
                if(x<y) return -1*dir;
                if(x>y) return 1*dir;
            }
            return 0;
        });
        // The header shows the order of the levels, so it is clear which is
        // sorting first when more than one is in force.
        Array.from(tbl.tHead.rows[0].cells).forEach((th,i)=>{
            const lvl=tbl._sortKeys.findIndex(k=>k.idx===i);
            th.classList.toggle('sorted',lvl>=0);
            const ico=th.querySelector('.sort-ico');
            if(ico) ico.className='fas sort-ico '+(lvl>=0?(tbl._sortKeys[lvl].asc?'fa-sort-up':'fa-sort-down'):'fa-sort');
            let badge=th.querySelector('.sort-lvl');
            if(tbl._sortKeys.length>1&&lvl>=0){
                if(!badge){ badge=document.createElement('sup'); badge.className='sort-lvl'; th.appendChild(badge); }
                badge.textContent=lvl+1;
            } else if(badge) badge.remove();
            if(lvl>=0) th.setAttribute('aria-sort',tbl._sortKeys[lvl].asc?'ascending':'descending');
            else th.removeAttribute('aria-sort');
        });
        tbl._page=1;
        renumberFirstColumn(tbl);
        renderPage(tbl);
    }

    // After a sort the leading # column is renumbered, so it always reads
    // 1..n down the page rather than carrying the old order with it.
    function renumberFirstColumn(tbl){
        const head=tbl.tHead?.rows[0]?.cells[0];
        if(!head||head.textContent.trim().replace(/[^#]/g,'')!=='#') return;
        tbl._rows.forEach((r,i)=>{ if(r.cells[0]) r.cells[0].textContent=i+1; });
    }

    function renderPage(tbl,showAll){
        const tbody=tbl.tBodies[0];
        const per=tbl._per;
        const rows=tbl._rows;
        tbody.innerHTML='';
        const slice=(showAll||!per)?rows:rows.slice((tbl._page-1)*per, tbl._page*per);
        slice.forEach(r=>tbody.appendChild(r));
        tbl._domRows=slice;              // so a later call can tell a repaint
        if(!per) return;
        const pages=Math.max(1,Math.ceil(rows.length/per));
        // The pager goes OUTSIDE the scrolling box, otherwise it scrolls away
        // with the rows. Combined with position:sticky it then stays on screen
        // however far down the page you are.
        const box=tbl.closest('.paged-wrap')||tbl.closest('.table-responsive');
        const host=box||tbl;
        let bar=host.nextElementSibling;
        if(!bar||!bar.classList.contains('pager')){
            bar=document.createElement('div');
            bar.className='pager';
            host.parentNode.insertBefore(bar,host.nextSibling);
        }
        if(rows.length<=per){ bar.innerHTML=''; return; }
        const from=(tbl._page-1)*per+1, to=Math.min(tbl._page*per,rows.length);
        bar.innerHTML='<span class="pager-info">'+t('showing_range')
              .replace('{a}',from).replace('{b}',to).replace('{n}',rows.length)+'</span>'
          +'<button type="button" class="btn-chip" '+(tbl._page===1?'disabled':'')+' data-go="prev"><i class="fas fa-chevron-left"></i></button>'
          +'<span class="pager-pos">'+tbl._page+' / '+pages+'</span>'
          +'<button type="button" class="btn-chip" '+(tbl._page===pages?'disabled':'')+' data-go="next"><i class="fas fa-chevron-right"></i></button>';
        bar.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
            tbl._page += (b.dataset.go==='next'?1:-1);
            tbl._page = Math.min(Math.max(1,tbl._page),pages);
            renderPage(tbl);
        }));
    }

    // ======================== REPORT PRINTING ========================
    // Every report is wrapped the same way, so printing produces a proper
    // sheet: organisation, report name, year, centre scope, and when it was

    function reportCard(titleKey, icon, year, innerHtml, extraMeta){

          +'<div class="card-body">'
            +'<div class="print-only print-head">'
              +'<div class="ph-org">SMVS &mdash; Swaminarayan Mandir Vasna Sanstha</div>'

                +(extraMeta?'<span>'+esc(extraMeta)+'</span>':'')

    // Prints one report and nothing else. The timestamp is stamped in at the
    // moment of printing, not when the report was loaded.
    function printReport(btn){
        const card=btn.closest('.report-card')||btn.closest('.card');
        if(!card){ window.print(); return; }
        const now=new Date();
        const pad=n=>String(n).padStart(2,'0');
        const stamp=pad(now.getDate())+'-'+pad(now.getMonth()+1)+'-'+now.getFullYear()
                   +' '+pad(now.getHours())+':'+pad(now.getMinutes());
        card.querySelectorAll('.ph-when').forEach(el=>{el.textContent=stamp;});
        document.querySelectorAll('.printing').forEach(el=>el.classList.remove('printing'));
        card.classList.add('printing');
        document.body.classList.add('printing-report');
        // Print every row, not only the page on screen.
        const paged=Array.from(card.querySelectorAll('table.sortable')).filter(tb=>tb._per);
        paged.forEach(tb=>renderPage(tb,true));
        const restore=()=>{
            card.classList.remove('printing');
            document.body.classList.remove('printing-report');
            paged.forEach(tb=>renderPage(tb));
            window.removeEventListener('afterprint',restore);
        };
        window.addEventListener('afterprint',restore);
        window.print();
        setTimeout(restore,1500);   // Safari does not always fire afterprint
    }

    let _mrStatus='pending';

    let _mrTimer=null;

    async function refreshMrBadge(){
        if(!can('member.requests')) return;
        const d=await api('/api/member-requests?status=pending','GET',null,true);
        if(!d) return;
        const n=d.pending||0;
        // the button on the Members page
        const b=document.getElementById('mrBadge');
        if(b){
            b.textContent=n||'';
            b.style.display=n?'':'none';
        }
        const btn=document.getElementById('mrBtn');
        if(btn) btn.classList.toggle('nudge', n>0);
        // and the menu entry, from anywhere
        const item=document.querySelector('.nav-item[data-page="members"]');
        if(item){
            let dot=item.querySelector('.nav-badge');
            if(n>0){
                if(!dot){
                    dot=document.createElement('b');
                    dot.className='nav-badge';
                    item.appendChild(dot);
                }
                dot.textContent=n;
                item.classList.add('nudge');
            } else {
                if(dot) dot.remove();
                item.classList.remove('nudge');
            }
        }
    }

    async function decideMr(id,decision){
        const r=await api('/api/member-requests/'+id,'POST',{decision:decision});
        if(!r) return;
        // Say which way the member was told, and if a gateway refused it say
        // that too - silently failing to inform somebody is the whole thing
        // this was meant to fix.
        const told=(r.told||[]);
        const good=told.filter(x=>x.status==='sent').map(x=>x.channel);
        const bad=told.filter(x=>x.status!=='sent').map(x=>x.channel);
        let line=t('saved');
        if(good.length) line+=' \u2022 '+t('mr_told')+' '+good.join(', ');
        if(bad.length) line+=' \u2022 '+t('mr_not_told')+' '+bad.join(', ');
        toast(line, bad.length?'error':'success');
        showMemberRequests();
        refreshMrBadge();
        // The member list behind the dialog now has a different firm name.
        if(currentPage==='members') loadMembers();
    }

        const d=await api('/api/notifications/whatsapp?year='+_notifyYear+'&audience='+aud+'&lang='+lang);
        if(!d)return;
        document.getElementById('nfResult').innerHTML=
          '<div class="io-status"><i class="fab fa-whatsapp"></i> '+t('wa_hint').replace('{n}',d.total)
          +(d.no_phone?' '+t('wa_no_phone').replace('{n}',d.no_phone):'')+'</div>'
          +'<div class="wa-list">'+d.links.map(l=>'<a class="wa-row" href="'+esc(l.link)+'" target="_blank" rel="noopener">'
            +'<span class="mem-code-cell">'+esc(l.member_code)+'</span><span class="wa-name">'+esc(l.name)+'</span>'
            +'<small>'+esc(l.center_name)+'</small><i class="fab fa-whatsapp"></i></a>').join('')+'</div>';
    }

    // ======================== FAST ENTRY ========================
    // A typing grid for rush periods. Deliberately narrow: no addresses, no
    // PAN, no email, no partners or directors. The full form is untouched and
    // still handles all of that.
    //
    // Keyboard: Enter moves down the column and adds a row at the bottom; Tab
    // moves across as normal. Rows are never re-rendered wholesale while you
    // type, because that would throw the caret back to the first cell.
    const FE_START_ROWS=2;          // the grid grows itself from here
    let _feRows=[], _feKind='member', _feCenters=[], _feDone=[], _feOffset=0, _feListOpen=false;

    let _feGroupSeq=0;
    function feBlankMember(){
        // Each row starts its own group; the + button copies this id onto the
        // new row so both save as ONE member with two businesses. Without it,
        // rows with a blank (AUTO) Member ID had nothing to group on and each
        // became a separate member.
        return {group:'g'+(++_feGroupSeq),
                member_code:'',name:'',mobile:'',member_type:'individual',business:'',
                center_id:USER.center_id||'',locked:false,note:''};
    }
    function feBlankSankalp(){ return {q:'',member_id:null,member_name:'',targets:[],target:'individual',amount:'',status:'',hint:''}; }

    async function showFastEntry(kind){
        _feKind=kind;
        const centers=await api('/api/centers');
        _feCenters=(centers||[]).filter(c=>c.is_active);
        // Two rows to begin with; more appear as you type.
        _feRows=Array.from({length:FE_START_ROWS},()=> kind==='member'?feBlankMember():feBlankSankalp());
        _feDone=[]; _feOffset=0; _feListOpen=false;
        const isMember=kind==='member';
        openModal(t(isMember?'fast_member':'fast_sankalp'),
          '<div class="fe-top"><p class="io-text">'+t(isMember?'fast_member_hint':'fast_sankalp_hint')+'</p>'
          +'<button type="button" class="btn btn-outline btn-sm" id="feListBtn" onclick="feShowDone()"><i class="fas fa-list-check"></i> '
            +t(isMember?'new_member_list':'new_sankalp_list')+' <span id="feDoneCount" class="fe-badge">0</span></button></div>'
          // One Year control on both grids. Switching it reloads that year's
          // list, so a new drive starts its numbering at 1.
          +'<div class="fe-year"><label>'+t('year')+' *</label>'
            +'<select id="feYear" onchange="feYearChanged()">'
            +YEAR_OPTS(parseInt(document.getElementById('filterYear')?.value||CURRENT_YEAR))+'</select>'
            +'<small class="field-hint">'+t('fe_year_hint')+'</small></div>'
          // Registering people at the door on the day itself: each one saved
          // gets a pass, is checked in, and takes the next seat.
          +(isMember&&can('pass.generate')&&can('attendance.checkin')
             ?'<div class="fe-eventday"><label class="check-inline">'
                +'<input type="checkbox" id="feEventDay" onchange="feEventDayChanged()"> '
                +t('event_day')+'</label>'
              +'<select id="feEventPassType" style="display:none">'
                +'<option value="general">'+t('pass_general')+'</option>'
                +'<option value="yajman">'+t('pass_yajman')+'</option>'
                +'<option value="guruji">'+t('pass_guruji')+'</option></select>'
              +'<small class="field-hint" id="feEventHint">'+t('event_day_hint')+'</small></div>'
             :'')
          +'<div class="fe-wrap"><table class="fe-table '+(isMember?'fe-member':'fe-sankalp')+'"><thead><tr>'
          +(isMember
            ? '<th class="c-n">#</th><th class="c-code">'+t('member_id')+'</th><th class="c-name">'+t('name')+' *</th>'
              +'<th class="c-mob">'+t('mobile')+'</th><th class="c-type">'+t('type')+'</th>'
              +'<th class="c-biz">'+t('firm_or_company')+'</th>'
              +(CENTER_ROLE?'':'<th class="c-ctr">'+t('center')+'</th>')+'<th class="c-act"></th>'
            : '<th class="c-n">#</th><th class="c-code">'+t('member_id')+'</th><th class="c-name">'+t('sankalp_in_name_of')+'</th>'
              +'<th class="c-amt num">'+t('amount')+'</th><th class="c-act"></th>')
          +'</tr></thead><tbody id="feBody"></tbody></table></div>'
          +'<div class="fe-actions">'
            +'<button type="button" class="btn btn-outline btn-sm" onclick="feAddRow()"><i class="fas fa-plus"></i> '+t('add_row')+'</button>'
            +'<button type="button" class="btn-chip" onclick="feAddRow(5)">+5</button>'
            +'<span id="feSummary" class="fe-summary"></span></div>'
          +'<div id="feResult"></div><div id="feList"></div>'
          +'<div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">'+t('close')+'</button>'
            +'<button type="button" class="btn btn-primary" onclick="feSave()"><i class="fas fa-save"></i> '+t('save_all')+'</button></div>', 'wide');
        feRender();
        // Pick up what this user already entered today, so closing and
        // reopening does not restart the count at 1 and lose the list.
        feLoadDone();                      // both grids, not just members
        setTimeout(()=>document.querySelector('#feBody input')?.focus(),60);
    }

    function feYear(){ return parseInt(document.getElementById('feYear')?.value||CURRENT_YEAR); }

    async function feYearChanged(){
        // A different drive year is a different count, so the grid and the
        // list both start again.
        _feRows=Array.from({length:FE_START_ROWS},()=> _feKind==='member'?feBlankMember():feBlankSankalp());
        _feDone=[]; _feOffset=0;
        const c=document.getElementById('feDoneCount'); if(c) c.textContent='0';
        document.getElementById('feResult').innerHTML='';
        feRender();
        await feLoadDone();
        if(_feListOpen) feShowDone(true);
    }

    async function feLoadDone(){
        const url = _feKind==='member'
            ? '/api/members/recent?year='+feYear()
            : '/api/sankalps/recent?year='+feYear();
        const d=await api(url);
        if(!d) return;
        _feDone=d.rows||[];
        _feOffset=_feDone.length;
        const c=document.getElementById('feDoneCount');
        if(c) c.textContent=_feDone.length;
        feRender();
        if(_feListOpen) feShowDone(true);
    }

    function feAddRow(n){
        for(let i=0;i<(n||1);i++) _feRows.push(_feKind==='member'?feBlankMember():feBlankSankalp());
        feRender();
        const rows=document.querySelectorAll('#feBody tr');
        rows[rows.length-(n||1)]?.querySelector('input,select')?.focus();
    }
    function feDelRow(i){
        _feRows.splice(i,1);
        if(!_feRows.length) _feRows.push(_feKind==='member'?feBlankMember():feBlankSankalp());
        feRender();
    }
    function feSet(i,f,v){ _feRows[i][f]=v; feMaybeGrow(i); feSummary(); }

    function feRowHasContent(r){
        return _feKind==='member'
            ? !!((r.member_code||'').trim()||(r.name||'').trim()||(r.mobile||'').trim()||(r.business||'').trim())
            : !!((r.q||'').trim()||String(r.amount||'').trim());
    }

    // Start typing in the last row and a fresh one appears underneath. The row
    // is appended to the tbody rather than redrawing the grid, so the caret and
    // any selection are left exactly where they are.
    function feMaybeGrow(i){
        if(i!==_feRows.length-1) return;
        if(!feRowHasContent(_feRows[i])) return;
        const row=_feKind==='member'?feBlankMember():feBlankSankalp();
        _feRows.push(row);
        const body=document.getElementById('feBody');
        if(body) body.insertAdjacentHTML('beforeend',
            _feKind==='member'?feMemberRow(row,_feRows.length-1):feSankalpRow(row,_feRows.length-1));
    }

    // Typing an ID on the parent row applies it to every row in the group, so
    // the child rows stay attached to the same person.
    function feGroupSet(i,field,v){
        feMaybeGrow(i);
        const g=_feRows[i].group;
        const rows=document.querySelectorAll('#feBody tr');
        const sel={name:'.c-name input',mobile:'.c-mob input'}[field];
        _feRows.forEach((r,ix)=>{
            if(r.group!==g) return;
            r[field]=v;
            if(ix!==i && sel){ const inp=rows[ix]?.querySelector(sel); if(inp) inp.value=v; }
        });
        feSummary();
    }

    function feCodeChanged(i,v){
        _feRows[i].member_code=v;
        feMaybeGrow(i);
        const g=_feRows[i].group;
        _feRows.forEach(r=>{ if(r.group===g) r.member_code=v; });
        const rows=document.querySelectorAll('#feBody tr');
        _feRows.forEach((r,ix)=>{
            if(r.group===g && ix!==i){
                const inp=rows[ix]?.querySelector('.c-code input');
                if(inp) inp.value=v;
            }
        });
        feSummary();
    }

    // Adds another firm/company for the SAME person: identity is copied from
    // this row and the caret lands straight in the Firm/Company cell.
    function feAddBusiness(i){
        const src=_feRows[i];
        const row={...feBlankMember(),
            group:src.group,                       // same person, same group
            member_code:src.member_code, name:src.name, mobile:src.mobile,
            center_id:src.center_id,
            member_type:(src.member_type==='individual'?'firm':src.member_type),
            locked:true, note:t('same_person')};
        _feRows.splice(i+1,0,row);
        feRender();
        const tr=document.querySelectorAll('#feBody tr')[i+1];
        const biz=tr?.querySelector('.c-biz input');
        if(biz){ biz.focus(); }
    }

    function feRowNo(i){ return _feOffset + i + 1; }

    function feRender(){
        const body=document.getElementById('feBody');
        if(!body)return;
        body.innerHTML=_feRows.map((r,i)=> _feKind==='member'?feMemberRow(r,i):feSankalpRow(r,i)).join('');
        feSummary();
    }

    function feMemberRow(r,i){
        const co=_feCenters.map(c=>'<option value="'+c.id+'" '+(String(r.center_id)===String(c.id)?'selected':'')+'>'+esc(c.label||c.name_en||c.name)+'</option>').join('');
        const needsBiz=(r.member_type==='firm'||r.member_type==='company');
        return '<tr class="'+(r.locked?'fe-child':'')+'"><td class="c-n fe-n">'+(r.locked?'\u21b3':feRowNo(i))+'</td>'
          +'<td class="c-code"><input value="'+esc(r.member_code)+'" placeholder="'+t('auto')+'" style="text-transform:uppercase" '
            +'oninput="feCodeChanged('+i+',this.value.toUpperCase())" onchange="feMemberLookup('+i+')" onkeydown="feKey(event,'+i+')"></td>'
          +'<td class="c-name"><input value="'+esc(r.name)+'" oninput="feGroupSet('+i+',\'name\',this.value)" onkeydown="feKey(event,'+i+')">'
            +(r.note?'<small class="fe-hit">'+esc(r.note)+'</small>':'')+'</td>'
          +'<td class="c-mob"><input value="'+esc(r.mobile)+'" inputmode="tel" oninput="feGroupSet('+i+',\'mobile\',this.value)" onkeydown="feKey(event,'+i+')"></td>'
          +'<td class="c-type"><select onchange="feTypeChanged('+i+',this.value)">'
            +'<option value="individual" '+(r.member_type==='individual'?'selected':'')+'>'+t('individual')+'</option>'
            +'<option value="firm" '+(r.member_type==='firm'?'selected':'')+'>'+t('firm')+'</option>'
            +'<option value="company" '+(r.member_type==='company'?'selected':'')+'>'+t('company')+'</option></select></td>'
          +'<td class="c-biz"><input value="'+esc(r.business)+'" '+(needsBiz?'':'disabled')+' placeholder="'+(needsBiz?t('required'):'\u2014')+'" '
            +'oninput="feSet('+i+',\'business\',this.value)" onkeydown="feKey(event,'+i+')"></td>'
          +(CENTER_ROLE?'':'<td class="c-ctr"><select onchange="feSet('+i+',\'center_id\',this.value)">'+co+'</select></td>')
          +'<td class="c-act">'
            +'<button type="button" class="btn-chip" title="'+t('add_business')+'" onclick="feAddBusiness('+i+')"><i class="fas fa-plus"></i></button>'
            +'<button type="button" class="btn-chip danger" onclick="feDelRow('+i+')" aria-label="'+t('remove')+'"><i class="fas fa-times"></i></button>'
          +'</td></tr>';
    }

    // Changing the type used to redraw the whole grid, which threw focus back
    // to the first cell - so Tab appeared to jump to Member ID. The one cell
    // that depends on the type is toggled in place instead.
    function feTypeChanged(i,val){
        _feRows[i].member_type=val;
        const tr=document.querySelectorAll('#feBody tr')[i];
        const biz=tr?.querySelector('.c-biz input');
        if(biz){
            const needs=(val==='firm'||val==='company');
            biz.disabled=!needs;
            biz.placeholder=needs?t('required'):'\u2014';
            if(!needs){ biz.value=''; _feRows[i].business=''; }
        }
        feSummary();
    }

    // Typing a Member ID that already exists pulls the person in - name,
    // mobile, type and centre - so a returning member is never retyped.
    async function feMemberLookup(i){
        const r=_feRows[i];
        const code=(r.member_code||'').trim();
        if(!code || r.locked) return;
        const d=await api('/api/members/quick?q='+encodeURIComponent(code));
        if(!d||!d.found) return;
        if(String(d.member_code).toUpperCase()!==code.toUpperCase()) return;  // name match, not an ID
        r.name=d.name; r.mobile=d.mobile||''; r.member_type=d.member_type||'individual';
        r.center_id=d.center_id;
        r.note=t('existing_member')+(d.last_year? ' \u2022 '+d.last_year.year+': '+fmt(d.last_year.amount):'');
        feRender();
        const tr=document.querySelectorAll('#feBody tr')[i];
        (tr?.querySelector('.c-biz input:not([disabled])')||tr?.querySelector('.c-mob input'))?.focus();
    }

    function feSankalpRow(r,i){
        const opts=r.targets.length
            ? r.targets.map(x=>'<option value="'+esc(x.key)+'" '+(r.target===x.key?'selected':'')+'>'+esc(x.label)+'</option>').join('')
            : '<option value="individual">\u2014</option>';
        return '<tr class="'+(r.status==='bad'?'fe-bad':'')+'"><td class="c-n fe-n">'+feRowNo(i)+'</td>'
          +'<td class="c-code"><input value="'+esc(r.q)+'" placeholder="'+t('id_or_name')+'" oninput="feLookup('+i+',this.value)" onkeydown="feKey(event,'+i+')">'
            +(r.member_name?'<small class="fe-hit">'+esc(r.member_name)+'</small>':'')
            +(r.hint?'<small class="fe-prev">'+esc(r.hint)+'</small>':'')
            +(r.status==='bad'?'<small class="fe-miss">'+t('not_found')+'</small>':'')+'</td>'
          +'<td class="c-name"><select '+(r.targets.length?'':'disabled')+' onchange="feSet('+i+',\'target\',this.value)">'+opts+'</select></td>'
          +'<td class="c-amt"><input type="number" min="1" class="num" value="'+esc(r.amount)+'" oninput="feSet('+i+',\'amount\',this.value)" onkeydown="feKey(event,'+i+')"></td>'
          +'<td class="c-act"><button type="button" class="btn-chip danger" onclick="feDelRow('+i+')" aria-label="'+t('remove')+'"><i class="fas fa-times"></i></button></td></tr>';
    }

    function feKey(e,i){
        if(e.key!=='Enter') return;
        e.preventDefault();
        const cell=e.target.closest('td');
        const col=Array.from(cell.parentNode.children).indexOf(cell);
        if(i===_feRows.length-1) feAddRow();     // empty last row: Enter still adds one
        const rows=document.querySelectorAll('#feBody tr');
        rows[i+1]?.children[col]?.querySelector('input,select')?.focus();
    }

    let _feTimers={};
    function feLookup(i,val){
        _feRows[i].q=val;
        feMaybeGrow(i);
        clearTimeout(_feTimers[i]);
        if(val.trim().length<2){ Object.assign(_feRows[i],{member_id:null,member_name:'',targets:[],status:'',hint:''}); feSummary(); return; }
        _feTimers[i]=setTimeout(async()=>{
            const d=await api('/api/members/quick?q='+encodeURIComponent(val.trim()));
            if(!d) return;
            const r=_feRows[i];
            if(r.q!==val) return;
            if(d.found){
                r.member_id=d.id; r.member_name=d.member_code+' \u2014 '+d.name;
                r.targets=d.targets; r.target=d.targets[0].key; r.status='';
                // Last year's pledge, so the desk can repeat or revise it.
                r.hint=d.last_year? t('last_gave').replace('{y}',d.last_year.year).replace('{a}',fmt(d.last_year.amount)) : '';
                if(d.last_year && !r.amount) r.amount=d.last_year.amount;
            } else {
                Object.assign(r,{member_id:null,member_name:'',targets:[],status:'bad',hint:''});
            }
            const tr=document.querySelectorAll('#feBody tr')[i];
            if(tr){
                const wasHere=tr.contains(document.activeElement);
                tr.outerHTML=feSankalpRow(r,i);
                if(wasHere){
                    const inp=document.querySelectorAll('#feBody tr')[i].querySelector('input');
                    inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
                }
            }
            feSummary();
        },280);
    }

    function feSummary(){
        const el=document.getElementById('feSummary');
        if(!el)return;
        if(_feKind==='member'){
            const n=new Set(_feRows.filter(r=>(r.name||'').trim())
                .map((r,ix)=>(r.member_code||'').trim()||'__'+ix)).size;
            el.textContent=t('n_rows_ready').replace('{n}',n);
        } else {
            const ok=_feRows.filter(r=>r.member_id&&parseFloat(r.amount)>0);
            el.textContent=t('n_rows_ready').replace('{n}',ok.length)+' \u2022 '+fmt(ok.reduce((a,r)=>a+parseFloat(r.amount||0),0));
        }
    }

    // Toggles: pressing New member list again closes it, as does Hide.
    function feShowDone(force){
        const box=document.getElementById('feList');
        if(!box) return;
        const want = (force===undefined) ? !_feListOpen : !!force;
        _feListOpen = want;
        const btn=document.getElementById('feListBtn');
        if(btn) btn.classList.toggle('active', want);
        if(!want){ box.innerHTML=''; return; }
        if(!_feDone.length){
            box.innerHTML='<div class="io-status"><i class="fas fa-circle-info"></i> '+t('nothing_saved_yet')
                +'<button type="button" class="btn-chip fe-hide" onclick="feShowDone(false)">'+t('hide')+'</button></div>';
            return;
        }
        box.innerHTML='<div class="io-status good"><i class="fas fa-list-check"></i> '
            +t('saved_today').replace('{n}',_feDone.length)
            +(_feKind==='sankalp'&&_feDone.length
               ?' \u2022 '+fmt(_feDone.reduce((a,x)=>a+(x.amount||0),0)):'')
            +(can('notify.whatsapp')?'<button type="button" class="btn-chip" onclick="feShareWhatsapp()"><i class="fab fa-whatsapp"></i> '+t('send_whatsapp')+'</button>':'')
            // The welcome message goes to the ticked people, one each, not as
            // one list to the volunteer.
            +((_feKind==='member'&&(can('notify.whatsapp')||can('notify.sms')))
               ?'<button type="button" class="btn-chip" onclick="feSendWelcome()"><i class="fas fa-paper-plane"></i> '+t('send_welcome')+'</button>':'')
            +'<button type="button" class="btn-chip" onclick="feCopyList()"><i class="fas fa-copy"></i> '+t('copy')+'</button>'
            +'<button type="button" class="btn-chip fe-hide" onclick="feShowDone(false)"><i class="fas fa-eye-slash"></i> '+t('hide')+'</button></div>'
          +'<div class="fe-done"><table class="table table-sm"><tbody>'
          +(_feKind==='member'
             ?'<tr class="fe-head"><td class="mid"><input type="checkbox" id="feAll" onchange="feTickAll(this)" title="'+t('select_all')+'"></td>'
               +'<td colspan="5"><small class="text-muted">'+t('tick_to_send')+'</small></td></tr>':'')
          +_feDone.map((x,ix)=>'<tr>'
              +(_feKind==='member'
                 ?'<td class="mid"><input type="checkbox" class="fe-pick" value="'+x.id+'"'
                   +(x.mobile===''?' disabled title="'+t('no_mobile')+'"':'')+'></td>':'')
              +'<td class="fe-n">'+(ix+1)+'</td>'
              +'<td><span class="mem-code-cell">'+esc(x.member_code||'')+'</span></td>'
              +'<td>'+esc(x.name)+(x.businesses&&x.businesses.length?'<br><small class="text-muted">'+esc(x.businesses.join(', '))+'</small>':'')+'</td>'
              +'<td class="text-muted">'+esc(x.center_name||'')+(x.when?'<br><small>'+esc(x.when)+'</small>':'')+'</td>'
              +(_feKind==='sankalp'?'<td class="num font-bold">'+fmt(x.amount||0)+'</td>':'')
              +'<td>'+(x.existing?'<span class="badge badge-info">'+t('updated')+'</span>':'<span class="badge badge-success">'+t('added')+'</span>')
                // What event mode produced, so the row shows it was registered.
                // One line: the pass and the seat are read out together, so
                // GN1537-008 beats two stacked rows.
                +((x.pass_number||x.seat_label)
                   ?'<br><small class="reg-code">'+esc(x.pass_number||'')
                     +(x.seat_label?'-'+esc(x.seat_label):'')+'</small>':'')
                +(x.event_error?'<br><small class="text-danger">'+esc(x.event_error)+'</small>':'')
              +'</td></tr>').join('')
          +'</tbody></table></div>';
    }

    function feTickAll(box){
        document.querySelectorAll('#feList .fe-pick:not(:disabled)')
            .forEach(c=>{ c.checked=box.checked; });
    }

    // The welcome message, to the people ticked in the list. Each person gets
    // their own - their firms, their pass number, their QR.
    async function feSendWelcome(){
        const picked=[...document.querySelectorAll('#feList .fe-pick:checked')]
            .map(c=>parseInt(c.value));
        if(!picked.length){ toast(t('tick_someone'),'error'); return; }
        const d=await api('/api/templates?year='+feYear());
        if(!d) return;
        const tpls=d.rows.filter(x=>x.is_active&&x.purpose==='welcome');
        if(!tpls.length){ toast(t('no_welcome_template'),'error'); return; }
        const chans=[['whatsapp','notify.whatsapp','ch_whatsapp'],['sms','notify.sms','ch_sms'],
                     ['email','notify.email','ch_email']].filter(c=>can(c[1]));
        openModal(t('send_welcome'),
          '<p class="io-text">'+t('welcome_hint').replace('{n}',picked.length)+'</p>'
          +'<div class="form-row">'
            +'<div class="form-group"><label>'+t('channel')+'</label><select id="fWcChannel">'

    async function feSave(){
        const box=document.getElementById('feResult');
        box.innerHTML='<div class="io-status"><i class="fas fa-spinner fa-spin"></i> '+t('saving')+'</div>';
        const payload=_feRows.map((r,i)=>({...r,_row:feRowNo(i)}));
        const url=_feKind==='member'?'/api/members/bulk':'/api/sankalps/bulk';
        const body={rows:payload, pujan_year:feYear()};
        // Event-day registration travels with the save, so each member is
        // given a pass, checked in and seated as part of the same request.
        if(_feKind==='member'&&document.getElementById('feEventDay')?.checked){
            body.event_mode=true;
            body.pass_type=document.getElementById('feEventPassType')?.value||'general';
        }
        let d;
        try{
            const res=await fetch(url,{method:'POST',
                headers:{'Content-Type':'application/json','X-CSRFToken':CSRF_TOKEN},
                body:JSON.stringify(body)});
            d=await res.json();
        }catch(err){ box.innerHTML='<div class="io-status bad">'+t('network_error')+'</div>'; return; }
        if(d.errors&&d.errors.length){
            box.innerHTML='<div class="io-status bad"><i class="fas fa-times-circle"></i> '
                +t('rows_with_problems').replace('{n}',d.errors.length)+' '+t('nothing_written')+'</div>'
                +'<div class="io-errors">'+d.errors.map(e=>'<div><b>'+t('row')+' '+e.row+':</b> '+esc(e.message)+'</div>').join('')+'</div>';
            return;
        }
        // Stay on the grid with a fresh set of rows, numbered on from where the
        // last batch finished, so the running count is visible all session.
        // Re-read from the server so the list is the real record, not a
        // browser-side tally that a refresh would lose.
        await feLoadDone();
        if(_feListOpen) feShowDone(true);
        _feRows=Array.from({length:FE_START_ROWS},()=> _feKind==='member'?feBlankMember():feBlankSankalp());
        feRender();
        const cnt=document.getElementById('feDoneCount');
        if(cnt) cnt.textContent=_feDone.length;
        box.innerHTML='<div class="io-status good"><i class="fas fa-check-circle"></i> '
            +t('fe_saved').replace('{n}',d.saved)+' \u2014 '+t('total_so_far').replace('{n}',_feDone.length)
            +' <a href="#" onclick="feShowDone();return false;">'+t('view_list')+'</a></div>';
        toast(t('fe_saved').replace('{n}',d.saved));
        if(_feKind==='member') loadMembers(); else loadSankalps();
        setTimeout(()=>document.querySelector('#feBody input')?.focus(),60);
    }

    // Two passes: a dry run that writes nothing, then the real thing. Confirm
    // only unlocks once a file has come back completely clean.
    async function ioRun(kind,commit){
        const f=document.getElementById('ioFile')?.files?.[0];
        const box=document.getElementById('ioResult');
        const btn=document.getElementById('ioCommitBtn');
        if(!f){ box.innerHTML=''; btn.disabled=true; return; }
        box.innerHTML='<div class="io-status"><i class="fas fa-spinner fa-spin"></i> '+t('checking')+'</div>';
        btn.disabled=true;
        const fd=new FormData();
        fd.append('file',f);
        fd.append('mode',commit?'commit':'validate');
        let d;
        try{
            const res=await fetch('/api/import/'+kind,{method:'POST',headers:{'X-CSRFToken':CSRF_TOKEN},body:fd});
            d=await res.json();
            if(!res.ok){ box.innerHTML='<div class="io-status bad"><i class="fas fa-times-circle"></i> '+esc(d.error||t('server_error'))+'</div>'; return; }
        }catch(err){ box.innerHTML='<div class="io-status bad"><i class="fas fa-times-circle"></i> '+t('network_error')+'</div>'; return; }

        if(d.errors&&d.errors.length){
            box.innerHTML='<div class="io-status bad"><i class="fas fa-times-circle"></i> '
                +t('rows_with_problems').replace('{n}',d.error_count)+' '+t('nothing_written')+'</div>'
                +'<div class="io-errors">'+d.errors.map(e=>'<div><b>'+t('row')+' '+e.row+':</b> '+esc(e.message)+'</div>').join('')
                +(d.error_count>d.errors.length?'<div class="text-muted">\u2026 '+(d.error_count-d.errors.length)+' '+t('more')+'</div>':'')+'</div>';
            return;
        }
        if(commit){
            const msg=t('imported').replace('{c}',d.created).replace('{u}',d.updated);
            box.innerHTML='<div class="io-status good"><i class="fas fa-check-circle"></i> '+msg+'</div>';
            toast(msg);
            const reload={centers:loadCenters,members:loadMembers,sankalps:loadSankalps,collections:loadCollections,users:loadUsers,partners:loadMembers}[d.kind||kind];
            if(reload) reload();
            setTimeout(closeModal,1200);
        } else {
            box.innerHTML=(d.switched?'<div class="io-status"><i class="fas fa-shuffle"></i> '
                    +t('detected_as').replace('{k}',esc(d.switched.to))+'</div>':'')
                +'<div class="io-status good"><i class="fas fa-check-circle"></i> '
                +t('ready_to_import').replace('{r}',d.rows).replace('{c}',d.created).replace('{u}',d.updated)+'</div>';
            btn.disabled=false;
        }
    }

    // Phonetic Gujarati from the English spelling, via Google Input Tools.
    // Transliteration, not translation: "Ghatlodia" -> "ઘાટલોડીયા", which is
    // what you actually want for a place name. Purely optional - if it fails
    // the Gujarati box just stays as typed.
    async function transliterateGu(srcId,dstId,btn){
        const src=document.getElementById(srcId), dst=document.getElementById(dstId);
        const text=(src?.value||'').trim();
        if(!text){ toast(t('type_english_first'),'warning'); return; }
        const old=btn.innerHTML;
        btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
        try{
            const res=await fetch('https://inputtools.google.com/request?text='+encodeURIComponent(text)
                +'&itc=gu-t-i0-und&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8');
            const d=await res.json();
            if(d&&d[0]==='SUCCESS'){
                dst.value=d[1].map(w=>(w[1]&&w[1][0])||'').join(' ').trim();
                toast(t('transliterated'));
            } else { toast(t('translit_failed'),'warning'); }
        }catch(err){ toast(t('translit_failed'),'warning'); }
        finally{ btn.disabled=false; btn.innerHTML=old; }
    }
