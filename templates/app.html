      +'<small class="field-hint" id="fUserCenterHint"></small></div>'
      +'<div class="form-group"><label>'+t('role')+' *</label>'
      +'<select id="fUserRole" required onchange="userRoleChanged(true)">'+ROLE_OPTS(u.role)+'</select></div></div><div class="form-row"><div class="form-group"><label>'+t('mobile')+'</label><input type="text" id="fUserMobile" value="'+esc(u.mobile)+'"></div><div class="form-group"><label>'+t('email')+'</label><input type="email" id="fUserEmail" value="'+esc(u.email)+'"></div></div><div class="form-row"><div class="form-group"><label>'+(id?t('new_password')+' ('+t('leave_empty')+')':t('password'))+'</label><input type="password" id="fUserPassword" '+(id?'':'required')+'></div><div class="form-group"><label>'+t('status')+'</label><select id="fUserActive"><option value="1" '+(u.is_active?'selected':'')+'>'+t('active')+'</option><option value="0" '+(!u.is_active?'selected':'')+'>'+t('inactive')+'</option></select></div></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> '+t('save')+'</button></div></form>');
        const ty=document.getElementById('fUserType');
        if(ty){
            ty.value = u.user_type || '';
            if(!ty.value) userRoleChanged(true); else userTypeChanged();
        }
        if(id) document.getElementById('fUserCenter').value = u.center_id || '';
    }
    async function saveUser(e,id){e.preventDefault();const data={username:document.getElementById('fUserUsername').value,full_name:document.getElementById('fUserFullname').value,role:document.getElementById('fUserRole').value,user_type:document.getElementById('fUserType').value,center_id:document.getElementById('fUserCenter').value||null,mobile:document.getElementById('fUserMobile').value,email:document.getElementById('fUserEmail').value,is_active:document.getElementById('fUserActive').value==='1'};const pwd=document.getElementById('fUserPassword').value;if(pwd)data.password=pwd;const res=id?await api('/api/users/'+id,'PUT',data):await api('/api/users','POST',data);if(res){
            closeModal();
            toast(id?t('user_updated'):t('user_added'));
            await loadUsers();
            // A brand-new user has no rights beyond their role, so go straight
            // to the rights screen rather than making them hunt for it.
            if(!id && res.user && can('user.manage')) showPermissions(res.user.id);
        }}
    async function deleteUser(id){if(!confirm(t('confirm_delete')))return;const r=await api('/api/users/'+id,'DELETE');if(r){toast(t('deleted'));loadUsers();}}

    // ======================== INIT ========================
    setupNav();
    // The waiting count on the menu, from wherever you are.
    watchMemberRequests();
    // ---------------- PASS PRINTING ----------------
    // Opens the dedicated /passes/print view. Printing from inside the modal
    // could never work: the print stylesheet hides .modal-overlay.
    // size: undefined for the existing card layout, 'wide' for the
    // 8.2 x 2.9 inch band printed in duplicate.
    // Checks first whether any of these have been printed before, and names
    // them, rather than quietly producing a second copy.
    async function printPasses(ids, size, copy, money) {
        const year = document.getElementById('filterYear')?.value || CURRENT_YEAR;
        if (ids) {
            const chk = await api('/api/passes/print-check?ids='
                + encodeURIComponent(ids) + '&year=' + year, 'GET', null, true);
            if (chk && chk.count) {
                const ok = await confirmReprint(chk.printed);
                if (!ok) return;
            }
        }
        doPrintPasses(ids, size, copy, money);
    }

    function confirmReprint(list){
        return new Promise(resolve=>{
            openModal(t('already_printed_title'),
              '<div class="io-status bad"><i class="fas fa-triangle-exclamation"></i> '
                +t('already_printed').replace('{n}',list.length)+'</div>'
              +'<div class="fe-wrap"><table class="fe-table"><thead><tr>'
                +'<th>'+t('seat_no')+'</th><th>'+t('pass_number')+'</th><th>'+t('member_label')+'</th>'
                +'<th>'+t('printed')+'</th></tr></thead><tbody>'
              +list.map(p=>'<tr><td class="slip-seat">'+esc(p.seat_label||'\u2014')+'</td>'
                +'<td><small class="mem-code">'+esc(p.pass_number)+'</small></td>'
                +'<td>'+esc(p.member_name)+'</td>'
                +'<td><small>'+esc(p.when||'')+(p.count>1?' \u00d7'+p.count:'')+'</small></td></tr>').join('')
              +'</tbody></table></div>'
              +'<div class="form-actions">'
                +'<button type="button" class="btn btn-outline" onclick="_reprintAnswer(false)">'+t('cancel')+'</button>'
                +'<button type="button" class="btn btn-primary" onclick="_reprintAnswer(true)"><i class="fas fa-print"></i> '+t('print_again')+'</button>'
              +'</div>', 'wide');
            window._reprintAnswer=(yes)=>{ closeModal(); resolve(yes); };
        });
    }

    function doPrintPasses(ids, size, copy, money) {
        const year = document.getElementById('filterYear')?.value || CURRENT_YEAR;
        const qs = ids ? 'ids=' + encodeURIComponent(ids) + '&year=' + year
                       : 'year=' + year + '&pass_type=' + (document.getElementById('filterPassType')?.value || '');
        window.open('/passes/print?' + qs + (size ? '&size=' + size : '')
            + (copy ? '&copy=' + copy : '')
            + (money === '0' ? '&money=0' : ''), '_blank', 'noopener');
    }

    // Asks which size before printing, so the existing layout stays the
    // default and nobody has to remember a URL.
    function choosePassSize(ids) {
        // Single-quoted inside a double-quoted attribute. IDs are digits and
        // commas, so nothing needs escaping.
        const arg = ids ? "'" + String(ids).replace(/[^0-9,]/g, '') + "'" : 'null';
        // Only offer what this user may actually print. Someone allowed only
        // the member copy sees one wide option, not three that then 403.
        const opts = [];
        if (can('pass.print_card')){
            opts.push({ icon:'fa-id-card', title:t('size_card'),
                        note:t('size_card_note'), args:arg });
            // The same card with the figures left off, for handing out.
            opts.push({ icon:'fa-id-card-clip', title:t('size_card_plain'),
                        note:t('size_card_plain_note'), args:arg+",null,null,'0'" });
        }
        if (can('pass.print_member') && can('pass.print_office'))
            opts.push({ icon:'fa-receipt', title:'8.2 &times; 2.9 in',
                        note:t('size_wide_note'), args:arg+",'wide'" });
        if (can('pass.print_member'))
            opts.push({ icon:'fa-user', title:t('copy_member'),
                        note:t('copy_member_note'), args:arg+",'wide','member'" });
        if (can('pass.print_office'))
            opts.push({ icon:'fa-building-columns', title:t('copy_office'),
                        note:t('copy_office_note'), args:arg+",'wide','office'" });

        if (!opts.length) { toast(t('no_print_right'), 'error'); return; }
        // Always ask, even when only one paper is permitted. Printing straight
        // away for some people and asking others looks like a fault, and it
        // hides which copy is about to come out.

        openModal(t('print_size'),
          '<p class="io-text">'+t('print_size_hint')+'</p>'
          +'<div class="size-choice'+(opts.length > 2 ? ' four' : '')+'">'
          +opts.map(o=>'<button type="button" class="size-card" onclick="closeModal();printPasses('+o.args+')">'
              +'<i class="fas '+o.icon+'"></i><b>'+o.title+'</b>'
              +'<small>'+o.note+'</small></button>').join('')
          +'</div>'
          +'<div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button></div>');
    }


    // ---------------- RESPONSIVE TABLES ----------------
    // Copies each column header onto its cells as data-label. The CSS then
    // stacks rows into cards below 768px instead of scrolling sideways.
    function labelTableCells(root) {
        root.querySelectorAll('table.table').forEach(tbl => {
            const heads = [...tbl.querySelectorAll('thead th')].map(th => th.textContent.trim());
            if (!heads.length) return;
            tbl.classList.add('table-stack');
            tbl.querySelectorAll('tbody tr').forEach(tr => {
                [...tr.children].forEach((td, i) => {
                    if (heads[i] && !td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i]);
                });
            });
        });
    }
    new MutationObserver(muts => {
        for (const m of muts) if (m.addedNodes.length) { labelTableCells(document.getElementById('pageBody')); break; }
    }).observe(document.getElementById('pageBody'), { childList: true, subtree: true });

    // ---------------- CHECK-IN QR SCANNER ----------------
    // Progressive enhancement: if the library or the camera is unavailable the
    // typed-entry field keeps working exactly as before.
    let _scanner = null;
    let _lastScan = { code: '', at: 0 };
    async function toggleScanner() {
        const box = document.getElementById('scannerBox');
        const btn = document.getElementById('scanBtn');
        if (!box) return;
        if (_scanner) { try { await _scanner.stop(); } catch (e) {} _scanner = null; box.style.display = 'none'; btn.classList.remove('active'); return; }
        if (typeof Html5Qrcode === 'undefined') { toast(t('scanner_unavailable'), 'warning'); return; }
        box.style.display = 'block';
        btn.classList.add('active');
        try {
            _scanner = new Html5Qrcode('scannerBox');
            // The library calls back on EVERY frame the code is visible, which
            // is why one pass produced a wall of identical messages. The same
            // code is accepted once and then ignored for a few seconds.
            // No qrbox. Passing one makes the library shade everything outside
            // a small square - that grey border was the "blank space", and it
            // also meant only that square was actually being scanned. Without
            // it the whole camera frame is live and the view is edge to edge.
            await _scanner.start(
                { facingMode: 'environment' },
                { fps: 12, aspectRatio: 1.0, disableFlip: false,
                  videoConstraints: { facingMode: 'environment',
                                      width: { ideal: 1280 }, height: { ideal: 1280 } } },
                code => {
                const now = Date.now();
                const val = String(code).trim().toUpperCase();
                if (val === _lastScan.code && now - _lastScan.at < 4000) return;
                _lastScan = { code: val, at: now };
                const f = document.getElementById('checkinPass');
                if (f) { f.value = val; checkIn(); }
                if (navigator.vibrate) navigator.vibrate(60);
            }, () => {});
        } catch (err) {
            toast(t('camera_denied'), 'error');
            box.style.display = 'none'; btn.classList.remove('active'); _scanner = null;
        }
    }

    updateUserRoleLabel();
    // Instructions first. Anything the app shows behind an unread page is a
    // distraction, so the gate goes up before the first screen loads.
    // Password first, then the instructions, then the app. In that order
    // because an account still on the seeded password is not really theirs
    // yet, and accepting instructions on somebody else's behalf is worse than
    // pointless.
    showPasswordGate()
        .then(showInstructionGate)
        .then(()=>navigateTo(firstAllowedPage()));
    // The permission map is rendered into the page at load, so a rights change
    // made while this person was signed in would not show until they logged in
    // again. Re-read it from the server on every load instead.
    refreshPermissions();
    </script>
</body>
