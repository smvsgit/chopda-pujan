    async function loadCentersForFilter(){const centers=await api('/api/centers');const sel=document.getElementById('filterCenter');if(sel&&centers)sel.innerHTML='<option value="">'+t('all')+'</option>'+centers.map(c=>'<option value="'+c.id+'">'+esc(c.label||c.name_en||c.name)+'</option>').join('');}
    // Search goes to the server, which looks across member name, Member ID,
    // mobile, PAN, email, address, firm and company names, partner names,
    // centre name and city, the pledge name and the pledge amount - and across
    // every page, not only the rows already loaded. Centre and Type stay local
    // because the whole list is already in hand.
    let _memberSearchTimer=null;
    function filterMembers(){
        clearTimeout(_memberSearchTimer);
        _memberSearchTimer=setTimeout(()=>loadMembers(
            (document.getElementById('filterSearch')?.value||'').trim()),280);
    }

    function applyMemberFilters(){
        const center=document.getElementById('filterCenter')?.value;
        const type=document.getElementById('filterType')?.value;
        let f=membersCache;
        if(center) f=f.filter(m=>m.center_id==center);
        // 'firm' matches anyone HOLDING a firm, not just members typed as one.
        if(type) f=f.filter(m=>m.member_type===type
            ||(type==='firm'&&(m.firms_count||0)>0)
            ||(type==='company'&&(m.companies_count||0)>0));
        renderMembersTable(f);
    }

    // ======================== MEMBER FORM ========================
    // A member can hold any number of firms and companies, and each of those
    // any number of partners / directors. The form is built from a live
    // in-memory model rather than from the DOM, so adding and removing rows
    // never loses what was already typed.
    let _mEntities = [];      // [{entity_type,name,address,email,contact,pan_number,gst_number,people:[...]}]

    // The Type column shows what the member actually holds, not just the
    // single word. Someone filed as Individual who owns two companies and a
    // firm now reads "Individual - 1 Firm, 2 Companies", so you can see at a
    // glance how many pledges are possible.
    function memberTypeCell(m){
        const f=m.firms_count||0, c=m.companies_count||0;
        const base='<span class="badge badge-info">'
            +(mtLabels[m.member_type]?mtLabels[m.member_type]():m.member_type)+'</span>';
        if(!f&&!c) return base;
        const chips=[];
        // Hovering names them, so there is no need to open the member.
        const fn=(m.entities||[]).filter(e=>e.entity_type==='firm').map(e=>e.name);
        const cn=(m.entities||[]).filter(e=>e.entity_type==='company').map(e=>e.name);
        if(f) chips.push('<span class="chip-count chip-firm" title="'+esc(fn.join(', '))+'"><i class="fas fa-handshake" aria-hidden="true"></i> '+f+' '+(f===1?t('firm'):t('firms'))+'</span>');
        if(c) chips.push('<span class="chip-count chip-company" title="'+esc(cn.join(', '))+'"><i class="fas fa-city" aria-hidden="true"></i> '+c+' '+(c===1?t('company'):t('companies'))+'</span>');
        return base+'<div class="chip-row">'+chips.join('')+'</div>';
    }

    let _centerOpts = [];     // cached for the per-partner centre dropdown
    function blankPerson(){ return {member_code:'',name:'',mobile:'',email:'',center_id:null}; }
    function blankEntity(type){
        return {entity_type:type,name:'',address:'',email:'',contact:'',gst_number:'',people:[blankPerson()]};
    }

    function addEntity(type){ _mEntities.push(blankEntity(type)); renderEntities(); }
    function removeEntity(i){ _mEntities.splice(i,1); renderEntities(); }
    function addPerson(i){ _mEntities[i].people.push(blankPerson()); renderEntities(); }
    function removePerson(i,j){
        if(_mEntities[i].people.length<=1) _mEntities[i].people[0]=blankPerson();
        else _mEntities[i].people.splice(j,1);
        renderEntities();
    }
    // Every input writes straight back into the model on change.
    function setEntityField(i,f,v){ _mEntities[i][f]=v; }
    function setPersonField(i,j,f,v){ _mEntities[i].people[j][f]=v; }

    function entityBlock(ent,i){
        const isFirm = ent.entity_type==='firm';
        const who    = isFirm ? t('partner') : t('director');
        const icon   = isFirm ? 'fa-handshake' : 'fa-city';
        const title  = isFirm ? t('firm') : t('company');
        return '<div class="repeat-card">'
          +'<div class="repeat-head"><i class="fas '+icon+'" aria-hidden="true"></i><span>'+title+' '+(i+1)+'</span>'
          +'<button type="button" class="btn-chip danger" onclick="removeEntity('+i+')" aria-label="'+t('remove')+'"><i class="fas fa-trash" aria-hidden="true"></i></button></div>'
          +'<div class="form-row"><div class="form-group"><label>'+(isFirm?t('firm_name'):t('company_name'))+' *</label>'
            +'<input type="text" value="'+esc(ent.name)+'" required oninput="setEntityField('+i+',\'name\',this.value)"></div>'
            +'<div class="form-group"><label>'+t('email')+'</label>'
            +'<input type="email" value="'+esc(ent.email)+'" oninput="setEntityField('+i+',\'email\',this.value)" placeholder="notice@example.com"></div></div>'
          +'<div class="form-row"><div class="form-group"><label>'+t('contact_no')+'</label>'
            +'<input type="text" value="'+esc(ent.contact)+'" oninput="setEntityField('+i+',\'contact\',this.value)"></div>'
            +'<div class="form-group"></div></div>'
          +'<div class="form-group"><label>'+t('address')+'</label>'
            +'<textarea rows="2" oninput="setEntityField('+i+',\'address\',this.value)">'+esc(ent.address)+'</textarea></div>'
          +'<div class="repeat-sub"><div class="repeat-sub-title">'+who+' '+t('details')
          +'<small class="sub-hint">'+t('partner_center_hint')+'</small></div>'
          + ent.people.map((p,j)=>
              '<div class="person-row">'
              // Member ID is optional: it is only needed when the partner sits
              // in another centre, because that decides who collects. The name
              // is required only once a row has anything in it at all.
              // Designation is not typed in - Partner for a firm, Director for
              // a company.
              +'<input type="text" value="'+esc(p.member_code||'')+'" placeholder="'+t('member_id')+'" style="text-transform:uppercase" oninput="setPersonField('+i+','+j+',\'member_code\',this.value.toUpperCase())">'
              +'<input type="text" value="'+esc(p.name)+'" placeholder="'+t('name')+'" oninput="setPersonField('+i+','+j+',\'name\',this.value)">'
              +'<input type="text" value="'+esc(p.mobile)+'" placeholder="'+t('mobile')+'" oninput="setPersonField('+i+','+j+',\'mobile\',this.value)">'
              +'<input type="email" value="'+esc(p.email)+'" placeholder="'+t('email')+'" oninput="setPersonField('+i+','+j+',\'email\',this.value)">'
              // A partner need not sit in the firm's centre. Whoever is named
              // on the pledge, THAT centre collects it.
              +'<select onchange="setPersonField('+i+','+j+',\'center_id\',this.value?parseInt(this.value):null)" title="'+t('collecting_center')+'">'
                +'<option value="">'+t('same_as_member')+'</option>'
                +_centerOpts.map(c=>'<option value="'+c.id+'" '+(String(p.center_id)===String(c.id)?'selected':'')+'>'+esc(c.label||c.name_en||c.name)+'</option>').join('')
              +'</select>'
              +'<button type="button" class="btn-chip danger" onclick="removePerson('+i+','+j+')" aria-label="'+t('remove')+'"><i class="fas fa-times" aria-hidden="true"></i></button>'
              +'</div>').join('')
          +'<button type="button" class="btn-chip" onclick="addPerson('+i+')"><i class="fas fa-plus" aria-hidden="true"></i> '+t('add')+' '+who+'</button>'
          +'</div></div>';
    }

    function renderEntities(){
        const box=document.getElementById('entityArea');
        if(!box) return;
        const firms=_mEntities.map((e,i)=>[e,i]).filter(([e])=>e.entity_type==='firm');
        const comps=_mEntities.map((e,i)=>[e,i]).filter(([e])=>e.entity_type==='company');
        const mt=document.getElementById('fMemberType')?.value||'individual';
        let html='';
        if(firms.length||mt==='firm'){
            html+='<div class="form-section"><div class="form-section-title"><i class="fas fa-handshake" aria-hidden="true"></i> '+t('firm_details')+'</div>'
                 +firms.map(([e,i])=>entityBlock(e,i)).join('')
                 +'<button type="button" class="btn btn-outline btn-sm" onclick="addEntity(\'firm\')"><i class="fas fa-plus"></i> '+t('add_firm')+'</button></div>';
        }
        if(comps.length||mt==='company'){
            html+='<div class="form-section"><div class="form-section-title"><i class="fas fa-city" aria-hidden="true"></i> '+t('company_details')+'</div>'
                 +comps.map(([e,i])=>entityBlock(e,i)).join('')
                 +'<button type="button" class="btn btn-outline btn-sm" onclick="addEntity(\'company\')"><i class="fas fa-plus"></i> '+t('add_company')+'</button></div>';
        }
        // A member can hold both, whichever type was picked.
        html+='<div class="add-other">'
             +(firms.length||mt==='firm'?'':'<button type="button" class="btn btn-outline btn-sm" onclick="addEntity(\'firm\')"><i class="fas fa-plus"></i> '+t('add_firm')+'</button>')
             +(comps.length||mt==='company'?'':'<button type="button" class="btn btn-outline btn-sm" onclick="addEntity(\'company\')"><i class="fas fa-plus"></i> '+t('add_company')+'</button>')
             +'</div>';
        box.innerHTML=html;
    }

    function toggleMemberFields(){
        const mt=document.getElementById('fMemberType').value;
        // Seed one empty block the first time a type is chosen, so the user
        // does not have to hunt for the add button.
        if(mt==='firm'    && !_mEntities.some(e=>e.entity_type==='firm'))    _mEntities.push(blankEntity('firm'));
        if(mt==='company' && !_mEntities.some(e=>e.entity_type==='company')) _mEntities.push(blankEntity('company'));
        renderEntities();
    }

    // Asks the server for the next free ID for the selected centre (SUR-0007).
    // It stays editable - use your own numbering if you already have one.
    async function suggestMemberCode(btn,onlyIfEmpty){
        const field=document.getElementById('fMemberCode');
        if(!field) return;
        if(onlyIfEmpty && field.value.trim()) return;
        const cid=document.getElementById('fMemberCenter')?.value;
        const r=await api('/api/members/next-code'+(cid?'?center_id='+cid:''));
        if(r&&r.member_code) field.value=r.member_code;
    }

    async function saveMember(e,id){
        e.preventDefault();
        const mt=document.getElementById('fMemberType').value;
        const named=_mEntities.filter(x=>(x.name||'').trim());
        for(const ent of named){
            for(const p of (ent.people||[])){
                if((p.name||'').trim() && !(p.member_code||'').trim()){
                    toast(t('person_id_required').replace('{n}',p.name),'warning');
                    return;
                }
            }
        }
        if(mt==='firm' && !named.some(x=>x.entity_type==='firm')){ toast(t('need_firm'),'warning'); return; }
        if(mt==='company' && !named.some(x=>x.entity_type==='company')){ toast(t('need_company'),'warning'); return; }
        const data={
            center_id:parseInt(document.getElementById('fMemberCenter').value),
            member_type:mt,
            member_code:document.getElementById('fMemberCode').value.trim().toUpperCase(),
            name:document.getElementById('fMemberName').value,
            mobile:document.getElementById('fMemberMobile').value,
            email:document.getElementById('fMemberEmail').value,
            dharmada_type:document.getElementById('fMemberDhType').value,
            dharmada_amount:document.getElementById('fMemberDhAmt').value||0,
            address:document.getElementById('fMemberAddr').value,
            entities:named
        };
        const res=id?await api('/api/members/'+id,'PUT',data):await api('/api/members','POST',data);
        if(res){closeModal();toast(id?t('member_updated'):t('member_added'));loadMembers();}
    }

    async function deleteMember(id){if(!confirm(t('confirm_delete')))return;const r=await api('/api/members/'+id,'DELETE');if(r){toast(t('deleted'));loadMembers();}}

    // ---- Guruji Darshan entry ----------------------------------------
    // A one-at-a-time desk screen, on the Sankalp page because what the desk
    // needs in front of it is the pledge, not the attendance list: the amount
    // is confirmed with the person standing there and the darshan tick follows
    // from the same button. The bulk-edit grid was the right shape already, so
    // this is that shape for one member, with last year beside this year -
    // which is the question actually asked at the desk.
    let _skDarshan = false;
    let _darshanRow = null;      // whoever is on screen right now
    let _dsQueue = [];           // seat + name only, as the desk sees it
    let _dsDone = 0;             // finished today, for the Completed badge
    let _dsTimer = null;         // the poll that keeps the queue live

    // Full screen on purpose: the sidebar and the pledge list underneath are
    // both distractions at a moving queue, and the desk needs the whole width
    // for a member who holds several firms.
    function setSkDarshan(on){
        _skDarshan = !!on;
        document.body.classList.toggle('sk-darshan-mode', _skDarshan);
        document.body.classList.toggle('bulk-fullscreen', _skDarshan);
        _darshanRow = null;
        _dsQueue = [];
        _dsDone = 0;
        clearInterval(_dsTimer); _dsTimer = null;
        renderDarshanPanel();
        if(_skDarshan){
            darshanPoll();
            // Every few seconds, so somebody checked in at the door turns up
            // here without anyone refreshing anything.
            _dsTimer = setInterval(darshanPoll, 5000);
        } else {
            loadSankalps();
        }
    }

    function renderDarshanPanel(){
        let box = document.getElementById('darshanPanel');
        // The clock is torn down here too. Removing only the panel left the
        // card behind on the plain list and in bulk edit.
        if(!_skDarshan){ if(box) box.remove(); renderWatch(); return; }
        if(!box){
            box = document.createElement('div');
            box.id = 'darshanPanel';
            box.className = 'card darshan-panel mb-4';
            const body = document.getElementById('pageBody');
            const bar = body.querySelector('.filter-bar');
            if(bar && bar.nextSibling) body.insertBefore(box, bar.nextSibling);
            else body.appendChild(box);
        }
        // Search sits on the title line. With the queue feeding itself it is
        // only there to jump out of order - somebody who came back later -
        // so it does not deserve a row of its own.
        box.innerHTML =
          '<div class="card-header ds-head"><h3><i class="fas fa-hands-praying"></i> '
            +t('darshan_entry')+'</h3>'
            // Finished, then still to come, then the jump field: the two
            // counts are what the desk keeps an eye on, and the detail behind
            // each is only read when somebody goes looking for a person.
            +'<button type="button" class="btn btn-sm btn-outline ds-pending-btn" '
              +'onclick="showDarshanCompleted()">'
              +'<i class="fas fa-circle-check"></i> '+t('darshan_completed_btn')
              +' <b class="ds-pending-count done" id="dsDoneCount">0</b></button>'
            +'<button type="button" class="btn btn-sm btn-outline ds-pending-btn" '
              +'onclick="showDarshanPending()">'
              +'<i class="fas fa-clock-rotate-left"></i> '+t('darshan_pending_btn')
              +' <b class="ds-pending-count" id="dsPendingCount">0</b></button>'
            +'<div class="ds-find">'
              +'<input type="text" id="dsFind" placeholder="'+t('darshan_find_opt')+'" '
                +'autocomplete="off" style="text-transform:uppercase" '
                +'onkeydown="if(event.key===\'Enter\'){event.preventDefault();darshanLookup();}">'
              +'<button type="button" class="btn btn-sm btn-outline" onclick="darshanLookup()">'
                +'<i class="fas fa-magnifying-glass"></i> '+t('search')+'</button>'
            +'</div>'
            +'<button type="button" class="btn btn-sm btn-outline ds-exit" onclick="exitDarshan()">'
              +'<i class="fas fa-xmark"></i> '+t('darshan_exit')+'</button></div>'
          +'<div class="card-body ds-split">'
            +'<div class="ds-main"><div id="dsBody"></div></div>'
            +'<aside class="ds-queue"><div class="ds-queue-h">'
              +'<span>'+t('darshan_queue')+'</span>'
              +'<b id="dsQueueCount">0</b></div>'
              +'<div id="dsQueueList"></div>'
              +'<small class="field-hint">'+t('darshan_auto_hint')+'</small></aside>'
          +'</div>';
        if(_darshanRow) paintDarshanMember(_darshanRow);
        else paintDarshanIdle();
        paintDarshanQueue();
        renderWatch();
    }

    function exitDarshan(){
        const box = document.getElementById('skDarshanMode');
        if(box) box.checked = false;
        setSkDarshan(false);
    }

    // ---- The clock ---------------------------------------------------
    // The time of day, not a stopwatch. It lives in its own card under the
    // desk and only while the desk is open: loading the next member repaints
    // the panel above it, and the card sitting outside that panel is what
    // keeps the clock from being torn down and rebuilt every few seconds.
    let _clkTimer = null;
    let _clkShown = true;

    function paintClock(){
        const face = document.getElementById('dwTime');
        if(!face){ stopClock(); return; }   // the card went; stop ticking
        const now = new Date();
        const p = n => String(n).padStart(2,'0');
        let h = now.getHours();
        const half = h < 12 ? 'AM' : 'PM';
        h = h % 12 || 12;                   // 12-hour, as the desk reads it
        face.innerHTML = p(h)+':'+p(now.getMinutes())+':'+p(now.getSeconds())
            + '<small>'+half+'</small>';
        const day = document.getElementById('dwDate');
        if(day) day.textContent = p(now.getDate())+'-'+p(now.getMonth()+1)
            +'-'+now.getFullYear();
    }

    function startClock(){
        stopClock();
        paintClock();
        _clkTimer = setInterval(paintClock, 1000);
    }

    // Leaving the screen must not leave an interval running behind it.
    function stopClock(){
        if(_clkTimer){ clearInterval(_clkTimer); _clkTimer = null; }
    }

    // Hidden collapses the face and leaves the header, so it can be brought
    // back. The clock stops ticking while hidden - there is nothing to keep up
    // to date - and is put right again the moment it is shown.
    function toggleWatch(){
        _clkShown = !_clkShown;
        const card = document.getElementById('darshanWatch');
        if(card) card.classList.toggle('hidden', !_clkShown);
        const btn = document.getElementById('dwToggle');
        if(btn) btn.innerHTML = '<i class="fas fa-eye'+(_clkShown?'-slash':'')+'"></i> '
            + (_clkShown ? t('hide') : t('show'));
        if(_clkShown) startClock(); else stopClock();
    }

    function renderWatch(){
        const body = document.getElementById('pageBody');
        let card = document.getElementById('darshanWatch');
        // Only on the Sankalp page with Guruji Darshan on. It used to be left
        // behind when darshan was closed, which is how it turned up on the
        // plain list and inside bulk edit.
        if(!_skDarshan || !body){
            stopClock();
            if(card) card.remove();
            return;
        }
        if(!card){
            card = document.createElement('div');
            card.id = 'darshanWatch';
            card.className = 'card darshan-watch';
            const panel = document.getElementById('darshanPanel');
            if(panel && panel.nextSibling) body.insertBefore(card, panel.nextSibling);
            else body.appendChild(card);
        }
        card.classList.toggle('hidden', !_clkShown);
        card.innerHTML =
          '<div class="dw-head"><h3><i class="fas fa-clock"></i> '+t('dw_watch')+'</h3>'
            +'<span class="dw-date" id="dwDate"></span>'
            +'<button type="button" class="btn btn-sm btn-outline dw-toggle" id="dwToggle" '
              +'onclick="toggleWatch()"><i class="fas fa-eye'+(_clkShown?'-slash':'')+'"></i> '
              +(_clkShown?t('hide'):t('show'))+'</button></div>'
          +'<div class="dw-body"><div class="dw-time" id="dwTime">--:--:--</div></div>';
        if(_clkShown) startClock(); else stopClock();
    }

    function paintDarshanIdle(){
        const body = document.getElementById('dsBody');
        if(body) body.innerHTML='<div class="ds-idle">'
          +'<i class="fas fa-hands-praying" aria-hidden="true"></i>'
          +'<div>'+t('darshan_queue_empty')+'</div></div>';
    }

    // Everyone who has arrived, in check-in order, with a double tick against
    // the ones already seen. Seat number and name only - that is all the desk
    // reads off the strip; the detail lives behind the Pending button.
    function paintDarshanQueue(){
        const list = document.getElementById('dsQueueList');
        const count = document.getElementById('dsQueueCount');
        const doneBadge = document.getElementById('dsDoneCount');
        if(count) count.textContent = _dsQueue.length;
        // Everyone on the strip is waiting: a finished name is taken off it.
        const waiting = _dsQueue;
        if(doneBadge) doneBadge.textContent = _dsDone;
        // The Pending badge counts people who came in but have not been sent
        // to darshan at all, which this strip does not hold - so it is read
        // from its own list rather than guessed at from here.
        refreshPendingCount();
        if(!list) return;
        if(!_dsQueue.length){
            list.innerHTML='<div class="ds-queue-empty">'+t('darshan_queue_empty')+'</div>';
            return;
        }
        const here = _darshanRow ? _darshanRow.member.id : 0;
        const nextId = waiting.length ? waiting[0].member_id : 0;
        list.innerHTML = _dsQueue.map(q=>
          '<button type="button" class="ds-q-row'
              +(q.member_id===here?' current':'')+(q.done?' done':'')+'" '
            +'data-q="'+q.member_id+'" onclick="darshanOpen('+q.member_id+')">'
            +'<strong class="seat-cell">'+esc(q.seat_label||'\u2014')+'</strong>'
            +'<span>'+esc(q.member_name)+'</span>'
            +darshanTick({darshan:q.darshan, darshan_done:q.done})
            +(!q.done&&q.member_id===nextId&&q.member_id!==here
               ?'<em>'+t('darshan_queue_next')+'</em>':'')
          +'</button>').join('')
          +(waiting.length?'':'<div class="ds-queue-empty">'+t('darshan_all_done')+'</div>');
        // A long morning's arrivals scroll off the top, so whoever is on the
        // screen is brought into view rather than left to be hunted for.
        const cur = list.querySelector('.ds-q-row.current');
        if(cur) cur.scrollIntoView({block:'nearest'});
    }

    // Checked in but not sent to darshan: nowhere in the strip, so the count
    // is asked for directly. Cheap, and only while the desk screen is open.
    async function refreshPendingCount(){
        const badge=document.getElementById('dsPendingCount');
        if(!badge) return;
        const year=document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const d=await api('/api/darshan/pending?year='+year, 'GET', null, true);
        if(!d) return;
        badge.textContent=d.total;
        badge.classList.toggle('none', d.total===0);
    }

    // Seat, pass, name and pledges, for either list. The two differ only in
    // which people are on them and which time column matters, so they share
    // one table rather than being written out twice.
    function darshanListModal(title, d, when, whenLabel, emptyMsg){
        const money=MONEY.sankalp();
        openModal(title+' ('+d.total+')',
          '<div class="io-status">'+t('n_members').replace('{n}',d.total)
            +(money?' \u2022 '+t('sankalp_amount')+': '+fmt(d.amount):'')+'</div>'
          +'<div class="fe-wrap"><table class="fe-table"><thead><tr>'
            +'<th class="mid">'+t('seat_no')+'</th>'
            +'<th class="mid">'+t('pass_number')+'</th>'
            +'<th class="lft">'+t('member_label')+'</th>'
            +'<th class="lft">'+t('sankalp_name_th')+'</th>'
            +(money?'<th class="num amt">'+t('sankalp_amount')+'</th>':'')
            +'<th class="mid">'+whenLabel+'</th>'
          +'</tr></thead><tbody>'
          +(d.rows.length?d.rows.map(r=>'<tr>'
              +'<td class="mid">'+seatCell(r)+'</td>'
              +'<td class="mid"><strong>'+esc(r.pass_number||'\u2014')+'</strong></td>'
              +'<td class="lft">'+esc(r.member_name)
                +'<small class="mem-code"> '+esc(r.member_code||'')+'</small></td>'
              +'<td class="lft"><small>'+esc(r.sankalp_name)+'</small></td>'
              +(money?'<td class="num amt">'+moneyOrDash(r.amount)+'</td>':'')
              +'<td class="mid"><small>'+esc(r[when]||'')+'</small></td>'
            +'</tr>').join('')
            :'<tr><td colspan="6" class="text-center text-muted py-4">'+emptyMsg+'</td></tr>')
          +'</tbody></table></div>'
          +'<div class="form-actions"><button type="button" class="btn btn-outline" '
            +'onclick="closeModal()">'+t('close')+'</button></div>','wide');
    }

    // Finished at Guruji's desk - the two ticks.
    async function showDarshanCompleted(){
        const year=document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const d=await api('/api/darshan/completed?year='+year);
        if(!d) return;
        d.rows.forEach(r=>{ r.darshan=true; r.darshan_done=true; });
        darshanListModal(t('darshan_completed_btn'), d, 'darshan_done_time',
                         t('darshan_done'), t('darshan_completed_none'));
    }

    // The detail behind the Pending count: enough to go and find a person who
    // came in but never reached the darshan line.
    async function showDarshanPending(){
        const year=document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const d=await api('/api/darshan/pending?year='+year);
        if(!d) return;
        darshanListModal(t('darshan_pending_btn'), d, 'check_in_time',
                         t('checkin_time'), t('darshan_pending_none'));
    }

    // The poll that makes the desk hands-free. It never replaces whoever is on
    // screen: a person standing there mid-confirmation must not be swapped out
    // because somebody else walked through the door.
    async function darshanPoll(){
        if(!_skDarshan) return;
        const year=document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const d=await api('/api/darshan/queue?year='+year, 'GET', null, true);
        if(!d) return;
        _dsQueue=d.rows||[];
        _dsDone=d.done||0;
        paintDarshanQueue();
        // The first arrival still unticked, not simply the first arrival -
        // the strip now holds people who have already been seen.
        const next=_dsQueue.find(q=>!q.done);
        if(!_darshanRow && next) darshanOpen(next.member_id);
    }

    async function darshanOpen(memberId){
        const year=document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const d=await api('/api/darshan/lookup?year='+year+'&member_id='+memberId,
                          'GET', null, true);
        if(!d){ toast(api.lastError||t('no_data'),'error'); return; }
        _darshanRow=d;
        paintDarshanMember(d);
        paintDarshanQueue();
    }

    async function darshanLookup(){
        const field = document.getElementById('dsFind');
        const code = (field?.value||'').trim();
        if(!code) return;
        const year = document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const d = await api('/api/darshan/lookup?year='+year+'&code='+encodeURIComponent(code), 'GET', null, true);
        const body = document.getElementById('dsBody');
        if(!d){
            _darshanRow = null;
            if(body) body.innerHTML='<div class="io-status err">'
                +esc(api.lastError||t('no_data'))+'</div>';
            field?.select();
            return;
        }
        _darshanRow = d;
        paintDarshanMember(d);
    }

    function paintDarshanMember(d){
        const body = document.getElementById('dsBody');
        if(!body) return;
        const seat = seatCell(d);
        const T2 = d.totals||{};
        // Headers carry the year rather than "last" and "this": at a desk in
        // November nobody should have to work out which year is which.
        const yThis = String(d.year), yLast = String(d.last_year);
        const dh = d.member.dharmada_type||'', dhAmt = d.member.dharmada_amount;
        // Dharmada belongs to the member, not to one pledge, so every row
        // shows the same pair of boxes and typing in any of them updates the
        // rest. Putting them on the first row only left the other rows looking
        // as though the field was missing, which is how it read.
        //
        // The amount box carries its own class. It used to share .ds-amt with
        // the pledge box, and since it comes first in the row, the save picked
        // it up as the pledge amount - an empty dharmada box then sent a
        // pledge of zero and the server rightly refused it. That is the
        // "amount must be greater than zero" error.
        const dhCell = ()=>'<td class="mid">'
                +(d.can_dharmada
                   ?'<select class="ds-dh-type" onchange="dsSyncDharmada(this)">'
                     +['','R','I/R','P','N'].map(v=>'<option value="'+v+'"'
                        +(dh===v?' selected':'')+'>'+(v||'\u2014')+'</option>').join('')
                     +'</select>'
                   :'<small class="dh-type">'+(dh?esc(dh):'\u2014')+'</small>')
              +'</td>'
              +'<td class="num">'
                +(d.can_dharmada
                   ?'<input type="number" class="ds-amt ds-dh-amt" min="0" value="'
                     +(dhAmt?dhAmt:'')+'" oninput="dsSyncDharmada(this)">'
                   :'<span>'+moneyOrDash(dhAmt)+'</span>')
              +'</td>';
        body.innerHTML =
          '<div class="ds-who">'
            +'<div class="ds-seat">'+seat+'</div>'
            +'<div class="ds-name"><strong>'+esc(d.member.name)+'</strong>'
              +'<small>'+esc(d.member.member_code||'')
                +(d.member.center_name?' \u2022 '+esc(d.member.center_name):'')
                +(d.pass_number?' \u2022 '+esc(d.pass_number):'')+'</small></div>'
            // Just the state. The timestamp that used to trail it was too
            // small to read and the clock beside it already says the time.
            +'<div class="ds-state">'+(d.darshan_done
                ?'<span class="badge badge-success">'+t('darshan_done')+'</span>'
                :'<span class="badge badge-warning">'+t('darshan_pending')+'</span>')+'</div>'
          +'</div>'
          // Every firm and company the member holds is a row here, all on the
          // one screen - no paging, because the desk confirms them together.
          +'<div class="table-responsive"><table class="table table-striped ds-table"><thead><tr>'
            +'<th>'+t('sankalp_name_th')+'</th>'
            +'<th>'+t('sankalp_type')+'</th>'
            +(MONEY.sankalp()?'<th class="num">'+t('yr_sankalp').replace('{y}',yLast)+'</th>':'')
            +(MONEY.pending()?'<th class="num">'+t('yr_pending').replace('{y}',yLast)+'</th>':'')
            +(MONEY.dharmada()?'<th class="mid">'+t('d_type_full')+'</th>'
                              +'<th class="num">'+t('d_amt_full')+'</th>':'')
            +(MONEY.sankalp()?'<th class="num">'+t('yr_sankalp').replace('{y}',yThis)+'</th>':'')
          +'</tr></thead><tbody>'
          +(d.rows.length?d.rows.map((r,i)=>'<tr data-ds="'+r.id+'">'
              +'<td><strong>'+esc(r.sankalp_name)+'</strong></td>'
              +'<td><span class="badge badge-saffron">'
                +(skTypeLabels[r.sankalp_type]?skTypeLabels[r.sankalp_type]():r.sankalp_type)+'</span></td>'
              +(MONEY.sankalp()?'<td class="num text-muted">'+moneyOrDash(r.last_amount)+'</td>':'')
              +(MONEY.pending()?'<td class="num text-danger">'+moneyOrDash(r.last_pending)+'</td>':'')
              +(MONEY.dharmada()?dhCell():'')
              +(MONEY.sankalp()?'<td class="num">'
                  +(d.can_edit
                     ?'<input type="number" class="ds-amt ds-year-amt" min="0" value="'+(r.amount===null?'':r.amount)+'">'
                     :'<span class="font-bold">'+moneyOrDash(r.amount)+'</span>')+'</td>':'')
            +'</tr>').join('')
            :'<tr><td colspan="7" class="text-center text-muted py-4">'+t('no_sankalp')+'</td></tr>')
          +'</tbody>'
          // One cell per column, no colspans. A colspan makes the browser
          // share out the width differently in the footer than in the head, so
          // the totals sat a few pixels off the figures above them.
          +(d.rows.length>1?'<tfoot><tr class="font-bold"><td>'+t('total')+'</td><td></td>'
              +(MONEY.sankalp()?'<td class="num">'+moneyOrDash(T2.last_amount)+'</td>':'')
              +(MONEY.pending()?'<td class="num text-danger">'+moneyOrDash(T2.last_pending)+'</td>':'')
              // No dharmada is a dash, not a zero - a zero reads as a figure
              // somebody entered.
              +(MONEY.dharmada()?'<td></td><td class="num"><span class="ds-dh-total">'
                  +(dhAmt?fmt(dhAmt):'\u2014')+'</span></td>':'')
              +(MONEY.sankalp()?'<td class="num">'+moneyOrDash(T2.amount)+'</td>':'')
            +'</tr></tfoot>':'')
          +'</table></div>'
          +'<div class="ds-actions">'
            +'<button type="button" class="btn btn-outline" onclick="darshanClear()">'
              +'<i class="fas fa-xmark"></i> '+t('cancel')+'</button>'
            +'<button type="button" class="btn btn-primary btn-lg" id="dsNext" onclick="darshanSaveNext()">'
              +'<i class="fas fa-hands-praying"></i> '+t('darshan_next')+'</button>'
          +'</div>';
    }

    // Skipping whoever is on screen. They stay in the queue - they have not
    // been to darshan - so the next poll offers them again, which is what
    // should happen when someone steps out of the line for a moment.
    // Dharmada is one figure for the member however many pledges are on
    // screen, so a change in any row is copied to the others straight away -
    // otherwise two rows would disagree and whichever was read first would
    // silently win.
    function dsSyncDharmada(el){
        const cls = el.classList.contains('ds-dh-type') ? '.ds-dh-type' : '.ds-dh-amt';
        document.querySelectorAll('#dsBody '+cls).forEach(other=>{
            if(other!==el) other.value = el.value;
        });
        const foot = document.querySelector('#dsBody tfoot .ds-dh-total');
        if(foot && cls === '.ds-dh-amt')
            foot.textContent = el.value ? fmt(el.value) : '\u2014';
    }

    function darshanClear(){
        _darshanRow = null;
        const f=document.getElementById('dsFind');
        if(f) f.value='';
        paintDarshanIdle();
        paintDarshanQueue();
    }

    // Amounts first, then the tick, then straight back to the box for the next
    // member ID - so a queue moves without touching the mouse.
    async function darshanSaveNext(){
        if(!_darshanRow) return;
        const d=_darshanRow;
        const amounts=[];
        document.querySelectorAll('#dsBody tr[data-ds]').forEach(tr=>{
            // The pledge box specifically, not whatever number field happens
            // to come first in the row.
            const input=tr.querySelector('.ds-year-amt');
            if(!input) return;
            const raw=(input.value||'').trim();
            // A box left empty is not a pledge of nothing - it is a box nobody
            // touched, so the stored amount stands.
            if(!raw) return;
            const v=parseFloat(raw);
            const row=(d.rows||[]).find(r=>r.id===parseInt(tr.dataset.ds));
            if(row && !isNaN(v) && v!==row.amount) amounts.push({id:row.id, amount:v});
        });
        const payload={member_id:d.member.id, pujan_year:parseInt(d.year),
                       amounts:amounts};
        // Every row carries the same pair, kept in step by dsSyncDharmada, so
        // the first one speaks for the member.
        const dhType=document.querySelector('#dsBody .ds-dh-type');
        const dhAmt=document.querySelector('#dsBody .ds-dh-amt');
        if(dhType) payload.dharmada_type=dhType.value;
        if(dhAmt) payload.dharmada_amount=dhAmt.value||0;
        const btn=document.getElementById('dsNext');
        if(btn) btn.disabled=true;
        const res=await api('/api/darshan/save','POST', payload, true);
        if(btn) btn.disabled=false;
        if(!res){ toast(api.lastError||t('server_error'),'error'); return; }
        // The confirmation is the seat number and the double tick, nothing
        // more: it is what the volunteer reads out before calling the next.
        const body=document.getElementById('dsBody');
        if(body) body.innerHTML='<div class="ds-done">'
          +'<div class="ds-seat"><strong class="seat-cell">'+esc(res.seat_label||'\u2014')+'</strong>'
            +'<span class="darshan-tick two"><i class="fas fa-check"></i><i class="fas fa-check"></i></span></div>'
          +'<div><strong>'+esc(res.member)+'</strong><span>'
            +(res.already?t('darshan_done_already'):t('darshan_done'))

        // The tick appears beside the seat number on the pledge list too, and
        // the new amount with it, without a round trip - the list is behind
        // the full-screen desk and will be read when it is closed.

    // Releases every ticked row on the page, for when a batch needs redoing.
    async function bulkClearAll(){
        const boxes=[...document.querySelectorAll('#skTbody .bulk-check input:checked')];
        if(!boxes.length){ toast(t('nothing_to_clear')); return; }
        if(!confirm(t('confirm_clear').replace('{n}',boxes.length))) return;
        const ids=boxes.map(b=>parseInt(b.closest('tr').dataset.sk));
        for(const b of boxes){
            b.checked=false;
            await bulkLockRow(b, parseInt(b.closest('tr').dataset.sk));
        }
        // Drop the saved stamp too, so a reopened grid agrees with the screen.
        await api('/api/sankalps/unverify','POST',{ids:ids},true);
        toast(t('cleared_n').replace('{n}',ids.length));
    }

    // Ticking saves the amount and freezes the row; unticking releases it.
    async function bulkLockRow(box,sid){
        const tr=box.closest('tr');
        const input=tr.querySelector('.amt-edit');
        if(!box.checked){
            input.disabled=false;
            tr.querySelectorAll('.dh-type-edit,.dh-amt-edit').forEach(e=>e.disabled=false);
            tr.classList.remove('sk-locked');
            return;
        }
        const amount=parseFloat(input.value||'0');
        if(!(amount>0)){
            box.checked=false;
            toast(t('amount_needed'),'error');
            input.focus();
            return;
        }
        tr.classList.add('sk-saving');
        const res=await api('/api/sankalps/'+sid,'PUT',
            {amount:amount, remark:t('bulk_edit')}, true);
        tr.classList.remove('sk-saving');
        if(!res){
            box.checked=false;
            toast(api.lastError||t('server_error'),'error');
            return;
        }
        input.disabled=true;
        // Dharmada is part of the same confirmation, so it locks with the row.
        tr.querySelectorAll('.dh-type-edit,.dh-amt-edit').forEach(e=>e.disabled=true);
        tr.classList.add('sk-locked');
        tr.querySelector('.amt-read').textContent=fmt(amount);
        tr.querySelector('td[data-v]')?.setAttribute('data-v',amount);
    }

    // The rows, separate from the page shell - the shell used to call
    // filterSankalps() to fill itself, which now re-fetches instead.
    // Rows that have a seat, or everything - the same choice as Passes.
    function skSeatFilter(rows){
        const mode=document.getElementById('filterSkSeat')?.value||'all';
        return mode==='seat' ? (rows||[]).filter(r=>r.seat_no) : (rows||[]);
    }

    // 'dd-mm-yyyy HH:MM' as whole minutes, for sorting. Our own format, so it
    // is read with a pattern rather than handed to Date(), which would take
    // 08-09-2026 for the eighth of September or the ninth of August depending
    // on the browser.
    function tickMinutes(str){
        const m = /^(\d{2})-(\d{2})-(\d{4})\s+(\d{2}):(\d{2})/.exec(str || '');
        if(!m) return 0;
        return Math.floor(Date.UTC(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) / 60000);
    }

    // What the Seat No. column sorts on, on the list and in bulk edit alike:
    //
    //   1. darshan stage - two ticks, then one, then none
    //   2. when that tick was given, earliest first
    //   3. seat number
    //
    // So the finished people head the list in the order Guruji saw them, and
    // the ones still to come follow in the order the attendance desk sent
    // them. Packed into one number because the sorter reads a single value per
    // cell: stage at 1e13, the minute at 1e4, the seat below that - far inside
    // what a double holds exactly. Untouched rows have no time, so they fall
    // back to plain seat order. A row with no seat has no value at all and
    // sinks to the bottom either way.
    function skSeatSort(s){
        if(!s.seat_no) return '';
        const rank = s.darshan_done ? 0 : (s.darshan ? 1 : 2);
        const when = tickMinutes(s.darshan_done ? s.darshan_done_time : s.darshan_time);
        return rank * 10000000000000 + when * 10000 + s.seat_no;
    }

    async function loadMembersForSankalp(keepMemberId){
        const cid=document.getElementById('fSkCenter').value;
        const sel=document.getElementById('fSkMember');
        sel.innerHTML='<option value="">-- --</option>';
        if(!cid)return;
        let members=await api('/api/members?center_id='+cid+'&year='+(document.getElementById('fSkYear')?.value||CURRENT_YEAR))||[];
        // A cross-centre pledge belongs to a member of ANOTHER centre, so the
        // centre's own member list will not contain them and the dropdown
        // came up blank when editing. Fetch that one member as well.
        if(keepMemberId&&!members.some(m=>m.id===keepMemberId)){
            const one=await api('/api/members/'+keepMemberId);
            if(one) members=[one].concat(members);
        }
        // The member objects are held in a lookup keyed by id.
        //
        // They used to be JSON-stuffed into a data-json attribute via esc(),
        // but esc() does not escape double quotes - so the attribute ended at
        // the first quote inside the JSON, JSON.parse threw, and the handler
        // died silently. That is why no firm/company dropdown ever appeared
        // and the pledge name never auto-filled.
        _skMembers={};
        (members||[]).forEach(m=>{_skMembers[m.id]=m;});
        sel.innerHTML='<option value="">-- '+t('select_member')+' --</option>'
            +(members||[]).map(m=>'<option value="'+m.id+'">'+esc(m.display_name)+'</option>').join('');
        sel.onchange=onMemberSelectedForSankalp;
    }

    function onMemberSelectedForSankalp(){
        const v=document.getElementById('fSkMember').value;
        currentMemberData = v ? (_skMembers[v]||null) : null;
        // Default the pledge type to what this member actually is, so the
        // picker appears without a second click.
        if(currentMemberData){
            const ts=document.getElementById('fSkType');
            if(ts&&ts.value==='individual'){
                if(currentMemberData.member_type==='firm')         ts.value='firm';
                else if(currentMemberData.member_type==='company') ts.value='company';
            }
        }
        refreshSankalpPickers();
    }

    // Which firm/company (and which partner/director) the pledge is in the
    // name of. A member can now hold several of each, so this has to be picked
    // rather than inferred.
    function refreshSankalpPickers(){
        const type=document.getElementById('fSkType')?.value;
        const wrapE=document.getElementById('fSkEntityWrap');
        const wrapP=document.getElementById('fSkPersonWrap');
        if(!wrapE||!wrapP)return;
        const d=currentMemberData;
        const wantFirm=(type==='firm'||type==='firm_partner');
        const wantComp=(type==='company'||type==='company_director');
        const wantPerson=(type==='firm_partner'||type==='company_director');
        if(!d||(!wantFirm&&!wantComp)){
            wrapE.style.display='none'; wrapP.style.display='none';
            autoFillSankalpName(); return;
        }
        const list=(d.entities||[]).filter(e=>e.entity_type===(wantFirm?'firm':'company'));
        if(list.length===0){
            wrapE.style.display='none'; wrapP.style.display='none';
            toast(wantFirm?t('member_has_no_firm'):t('member_has_no_company'),'warning');
            autoFillSankalpName(); return;
        }
        wrapE.style.display='block';
        // With only one, keep it visible but pre-selected - no extra clicks.
        document.getElementById('fSkEntityLabel').textContent=(wantFirm?t('firm'):t('company'))+' *';
        document.getElementById('fSkEntity').innerHTML=
            list.map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('');
        wrapP.style.display=wantPerson?'block':'none';
        refreshSankalpPeople();
    }

    function refreshSankalpPeople(){
        const type=document.getElementById('fSkType').value;
        const wantFirm=(type==='firm'||type==='firm_partner');
        const list=(currentMemberData?.entities||[]).filter(e=>e.entity_type===(wantFirm?'firm':'company'));
        const ent=currentEntity();
        const sel=document.getElementById('fSkPerson');
        document.getElementById('fSkPersonLabel').textContent=(wantFirm?t('partner'):t('director'))+' *';
        sel.innerHTML=((ent&&ent.people)||[]).map(p=>
            '<option value="'+p.id+'">'+esc(p.name)+(p.designation?' - '+esc(p.designation):'')+'</option>').join('')
            ||'<option value="">--</option>';
        autoFillSankalpName();
    }

    function currentEntity(){
        const type=document.getElementById('fSkType')?.value;
        const wantFirm=(type==='firm'||type==='firm_partner');
        const list=(currentMemberData?.entities||[]).filter(e=>e.entity_type===(wantFirm?'firm':'company'));
        const id=document.getElementById('fSkEntity')?.value;
        return list.find(e=>String(e.id)===String(id))||list[0]||null;
    }
    function currentPerson(){
        const ent=currentEntity();
        const id=document.getElementById('fSkPerson')?.value;
        if(!ent||!ent.people)return null;
        return ent.people.find(p=>String(p.id)===String(id))||null;
    }

    function autoFillSankalpName(){
        const nameField=document.getElementById('fSkName');
        if(!currentMemberData||!nameField)return;
        const type=document.getElementById('fSkType').value;
        const d=currentMemberData;
        const ent=currentEntity();
        const per=currentPerson();
        showCollectingCenter(d,ent,per,type);
        let name=d.name;
        switch(type){
            case 'individual':       name=d.name; break;
            case 'firm':
            case 'company':          name=ent?ent.name:d.name; break;
            case 'firm_partner':     name=(ent&&per)?per.name+' ('+ent.name+')':d.name; break;
            case 'company_director': name=(ent&&per)?ent.name+' - '+per.name+(per.designation?' ('+per.designation+')':''):d.name; break;
        }
        nameField.value=name;
    }

    // Says out loud which centre will collect, and names the firm as secondary
    // context when the partner sits in a different centre from the firm.
    function showCollectingCenter(d,ent,per,type){
        const box=document.getElementById('fSkCollectNote');
        if(!box)return;
        const isPersonPledge=(type==='firm_partner'||type==='company_director');
        if(!isPersonPledge||!ent||!per){ box.style.display='none'; return; }
        const pc=per.center_id||d.center_id;
        const pcName=(_centerOpts.find(c=>String(c.id)===String(pc))||{}).label||d.center_name;
        const cross=String(pc)!==String(d.center_id);
        box.style.display='block';
        box.className='collect-note'+(cross?' cross':'');
        box.innerHTML='<i class="fas fa-'+(cross?'exchange-alt':'hand-holding-heart')+'" aria-hidden="true"></i>'
            +'<div><strong>'+t('collected_by')+': '+esc(pcName)+'</strong>'
            +'<span>'+esc(ent.name)+' &bull; '+t('primary_center')+': '+esc(d.center_name)+'</span></div>';
    }

    async function saveSankalp(e,id){

    async function saveCollection(e){
        e.preventDefault();
        const mode=document.getElementById('fCollMode').value;
        const target=parseInt(document.getElementById('fCollSankalp').value);
        const data={
            mode:mode,
            amount:parseFloat(document.getElementById('fCollAmount').value),
            remarks:document.getElementById('fCollRemarks').value,
            pujan_year:parseInt(document.getElementById('fCollYear').value)
        };

                : t('collection_entered'));

    function renderPassesTable(passes){document.getElementById('pageBody').innerHTML='<div class="filter-bar"><div class="filter-group"><label>'+t('year')+':</label><select id="filterYear" onchange="loadPasses()">'+YEAR_OPTS(CURRENT_YEAR)+'</select></div><div class="filter-group"><label>'+t('pass_type')+':</label><select id="filterPassType" onchange="filterPasses()"><option value="">'+t('all')+'</option><option value="yajman">'+t('yajman')+'</option><option value="guruji">'+t('guruji')+'</option><option value="general">'+t('general')+'</option></select></div><div class="filter-group flex-grow"><input type="text" id="filterSearch" placeholder="'+t('search_any')+'" oninput="filterPasses()"></div>'

        +'<div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-striped sortable" data-page="20"><thead><tr><th data-sort="num">#</th><th class="mid" data-sort="num" data-default-sort="asc">'+t('seat_no')+'</th><th data-sort="text">'+t('pass_number')+'</th><th data-sort="text">'+t('pass_type')+'</th><th data-sort="text">'+t('member_id')+'</th><th data-sort="text">'+t('member_label')+'</th><th data-sort="text">'+t('center')+'</th>'
          +(MONEY.sankalp()?'<th class="num" data-sort="num">'+t('sankalp_amount')+'</th>':'')

    function filterPasses(){
        const type=document.getElementById('filterPassType')?.value;
        const search=(document.getElementById('filterSearch')?.value||'').toLowerCase();
        let f=window._passesCache||[];
        if(type) f=f.filter(p=>p.pass_type===type);
        // Default to the ones that have a seat, since those are the printable
        // ones; switch to All to see everything generated.
        if((document.getElementById('filterSeatOnly')?.value||'seat')==='seat')
            f=f.filter(p=>p.seat_no);
        if(search) f=f.filter(p=>
            (p.member_name||'').toLowerCase().includes(search)
            ||(p.pass_number||'').toLowerCase().includes(search)
            ||(p.member_code||'').toLowerCase().includes(search)
            ||(p.center_name||'').toLowerCase().includes(search)
            ||(p.seat_label||'').includes(search));
        window._passesShown=f;
        const tb=document.getElementById('passesTbody');
        if(!tb)return;
        tb.innerHTML=f.length===0
            ? '<tr><td colspan="'+(MONEY.sankalp()?10:9)+'" class="text-center text-muted py-4">'+t('no_pass')+'</td></tr>'
            : f.map((p,i)=>'<tr><td>'+(i+1)+'</td>'
                +'<td class="mid">'+(p.seat_label
                    ? '<strong class="seat-cell">'+esc(p.seat_label)+'</strong>'
                    : '<span class="text-muted">\u2014</span>')+'</td>'
                +'<td><strong class="pass-number">'+esc(p.pass_number)+'</strong></td>'
                +'<td><span class="badge badge-'+(p.pass_type==='yajman'?'gold':(p.pass_type==='guruji'?'saffron':'info'))+'">'
                  +(passTypeLabels[p.pass_type]?passTypeLabels[p.pass_type]():p.pass_type)+'</span></td>'
                +'<td><span class="mem-code-cell">'+esc(p.member_code||'')+'</span></td>'
                +'<td>'+esc(p.member_name)+(p.member_mobile?'<br><small class="text-muted">'+esc(p.member_mobile)+'</small>':'')+'</td>'
                +'<td>'+esc(p.center_name)+'</td>'
                +(MONEY.sankalp()?'<td class="num">'+(p.sankalp_amount?fmt(p.sankalp_amount):'-')+'</td>':'')
                +'<td><span class="badge badge-'+(p.is_used?'success':'warning')+'">'
                  +(p.is_used?t('pass_used'):t('pass_remaining'))+'</span></td>'
                // data-v drives sorting on this column: 0 = waiting to print,
                // 1 = already printed, 2 = no seat yet. Shift-click Seat No.
                // after it and the pending ones come out in seat order.
                +'<td class="action-btns mid" data-v="'+(p.is_used?(p.printed?1:0):2)+'">'
                  // Printing waits for the check-in: a pass with no seat yet
                  // would print an empty seat box, which is what the desk then
                  // has to write on by hand.
                  // Printable only once the seat exists. Until it has actually
                  // been printed the row says so, and afterwards it is just the
                  // button again.
                  +(p.is_used
                      ? (p.printed?'':'<span class="badge badge-gold print-pending">'+t('print_awaited')+'</span>')
                        +'<button class="btn-icon btn-print" onclick="choosePassSize(\''+p.id+'\')" title="'
                        +(p.printed?t('reprint')+(p.last_printed?' \u2022 '+p.last_printed:''):t('print'))
                        +'" aria-label="'+t('print')+'"><i class="fas fa-print" aria-hidden="true"></i></button>'
                      : '<button class="btn-icon btn-print" disabled title="'+t('print_after_checkin')+'" aria-label="'+t('print_after_checkin')+'"><i class="fas fa-print" aria-hidden="true"></i></button>')
                  +(!p.is_used?'<button class="btn-icon btn-delete" onclick="deletePass('+p.id+')" title="'+t('delete')+'"><i class="fas fa-trash"></i></button>':'')
                +'</td></tr>').join('');
        labelTableCells(document.getElementById('pageBody'));
        enhanceTables(document.getElementById('pageBody'));
    }

    // Darshan mode. Off on every fresh load: it is a decision for a session at
    // the darshan queue, and a mode left on by accident would silently stop
    // handing out seats at the arrival desk.
    let _darshanMode = false;

    function setDarshanMode(on){
        _darshanMode = !!on;
        document.body.classList.toggle('darshan-mode', _darshanMode);
        const key = document.getElementById('padGoKey');
        if (key){
            key.classList.toggle('pad-darshan', _darshanMode);
            key.innerHTML = '<i class="fas fa-'+(_darshanMode?'hands-praying':'check-circle')+'"></i>'
                + '<span>'+(_darshanMode?t('darshan'):t('checkin'))+'</span>';
        }
        const box = document.getElementById('checkinResult');
        if (box && _darshanMode){
            box.className = 'checkin-verdict info';
            box.innerHTML = '<i class="fas fa-hands-praying" aria-hidden="true"></i>'
              +'<div><strong>'+t('darshan')+'</strong><span>'+t('darshan_mode_on')+'</span></div>';
        }
        document.getElementById('checkinPass')?.focus({preventScroll:true});
    }

    // Seat number and, beside it, how far through darshan the person is:
    //   one tick   the attendance desk sent them - seat number unchanged
    //   two ticks  Guruji's desk finished them with Save & Next
    // Both in the seat cell on purpose: a column of its own was asked against,
    // and the seat is what gets read out at the queue anyway.
    function darshanTick(r){
        if(r.darshan_done) return '<span class="darshan-tick two" title="'
            +t('darshan_tick_two')+(r.darshan_done_time?' \u2022 '+esc(r.darshan_done_time):'')+'">'
            +'<i class="fas fa-check"></i><i class="fas fa-check"></i></span>';
        if(r.darshan) return '<span class="darshan-tick one" title="'
            +t('darshan_tick_one')+(r.darshan_time?' \u2022 '+esc(r.darshan_time):'')+'">'
            +'<i class="fas fa-check"></i></span>';
        return '';
    }

    function seatCell(r){
        return '<strong class="seat-cell">'+esc(r.seat_label||'\u2014')+'</strong>'
             + darshanTick(r);
    }

    // Shows who a number belongs to while it is being typed, so the desk can
    // see the name before committing. Debounced, and never blocks the field.
    let _peekTimer=null;
    function peekPass(){
        clearTimeout(_peekTimer);
        _peekTimer=setTimeout(async()=>{
            const box=document.getElementById('passPeek');
            const q=(document.getElementById('checkinPass')?.value||'').trim();
            if(!box) return;
            if(q.length<2){ box.innerHTML=''; box.className='pass-peek'; return; }
            const yr=document.getElementById('filterYear')?.value||CURRENT_YEAR;
            let d;
            try{
                const res=await fetch('/api/passes/lookup?year='+yr+'&q='+encodeURIComponent(q),
                                      {headers:{'X-CSRFToken':CSRF_TOKEN}});
                d=await res.json();
            }catch(err){ return; }
            // The field may have moved on while we were waiting.
            if((document.getElementById('checkinPass')?.value||'').trim()!==q) return;
            if(d.found){
                const p=d.pass;
                box.className='pass-peek ok'+(p.is_used?' used':'');
                box.innerHTML='<strong>'+esc(p.pass_number)+'</strong> \u2014 '+esc(p.member_name)
                    +'<small>'+esc(p.center_name)+' \u2022 '+esc(passTypeLabels[p.pass_type]?passTypeLabels[p.pass_type]():p.pass_type)
                    +(p.is_used?' \u2022 '+t('pass_used'):'')+'</small>';
            } else {
                box.className='pass-peek miss';
                box.innerHTML=esc(d.error||'');
            }
        },220);
    }

    // Drops a field into the message at the caret.
    function insertPlaceholder(text){
        const ta=document.getElementById('fTplBody');
        if(!ta) return;
        const a=ta.selectionStart||0, b=ta.selectionEnd||0;
        ta.value=ta.value.slice(0,a)+text+ta.value.slice(b);
        ta.focus();
        ta.selectionStart=ta.selectionEnd=a+text.length;
    }

    async function saveManual(e,id){
        e.preventDefault();
        // Multipart, because it carries the file - so this one does not go
        // through api(), which sends JSON.
        const fd=new FormData();
        if(id) fd.append('id',id);
        fd.append('title',document.getElementById('fMnTitle').value.trim());
        fd.append('title_gu',document.getElementById('fMnTitleGu').value.trim());
        fd.append('about',document.getElementById('fMnAbout').value.trim());
        fd.append('about_gu',document.getElementById('fMnAboutGu').value.trim());
        fd.append('audience',document.getElementById('fMnAudience').value);
        fd.append('sort_order',document.getElementById('fMnOrder').value||'100');
        fd.append('roles',JSON.stringify([...document.querySelectorAll('.fMnRole:checked')].map(c=>c.value)));
        fd.append('any_perms','[]');
        fd.append('is_active',document.getElementById('fMnActive').checked?'1':'0');
        const f=document.getElementById('fMnFile').files[0];
        if(f) fd.append('file',f);
        const fg=document.getElementById('fMnFileGu');
        if(fg && fg.files[0]) fd.append('file_gu',fg.files[0]);
        try {
            const r=await fetch('/api/manuals',{method:'POST',body:fd,
                headers:{'X-CSRFToken':CSRF_TOKEN}});
            const data=await r.json();
            if(!r.ok){ toast(data.error||t('error'),'error'); return; }
            closeModal(); toast(t('saved'));
            _commTab='manuals'; loadCommunication();
        } catch(err){ toast(String(err),'error'); }
    }

    // A scan while darshan mode is on. Marks darshan against the seat the
    // person already has; a repeat scan says so plainly instead of failing,
    // because the same pass gets read twice in a moving queue.
    async function darshanScan(code, year, box){
        const res = await api('/api/attendance/darshan','POST',
            {pass_number:code, pujan_year:year}, true);
        if(!res){
            box.className='checkin-verdict fail';
            box.innerHTML='<i class="fas fa-times-circle" aria-hidden="true"></i>'
              +'<div><strong>'+esc(code)+'</strong><span>'
                +esc(api.lastError||t('checkin_failed'))+'</span></div>';
            return;
        }
        box.className='checkin-verdict ok'+(res.already?' repeat':'');
        // One tick here. The second one is Guruji's to give, and showing two
        // at the attendance desk would say the darshan was already finished.
        box.innerHTML='<i class="fas fa-hands-praying" aria-hidden="true"></i>'
          +(res.seat_label?'<div class="seat-badge darshan"><small>'+t('seat_no')+'</small>'
              +'<b>'+esc(res.seat_label)+'</b>'
              +'<span class="darshan-tick one"><i class="fas fa-check"></i></span></div>':'')
          +'<div><strong>'+esc(res.member)+'</strong><span>'
            +(res.already?t('darshan_already'):t('darshan_marked'))+'</span></div>';
        // The tick goes onto the row that is already on screen rather than
        // reloading the list, which would wipe this panel.
        const tb=document.querySelector('#pageBody table.table tbody');
        if(tb && res.attendance){
            [...tb.querySelectorAll('tr')].forEach(tr=>{
                const cells=tr.querySelectorAll('td');
                if(cells.length<2) return;
                const seat=cells[1].querySelector('.seat-cell');
                if(seat && seat.textContent.trim()===String(res.seat_label))
                    cells[1].innerHTML=seatCell(res.attendance);
            });
        }
    }

    // ---- Picking members by hand -------------------------------------
    // "Everyone with a pledge" covers most sends, but not "just tell these
    // four". The picker is loaded only when it is asked for - a centre with
    // two thousand members should not pay for a list nobody opened.
    let _pickChosen = new Set();

    async function bcScopeChanged(){
        const wrap=document.getElementById('bcPickWrap');
        const scope=document.getElementById('fBcScope').value;
        if(!wrap) return;
        if(scope!=='selected'){ wrap.style.display='none'; return; }
        wrap.style.display='';
        wrap.innerHTML='<div class="io-status">'+t('loading')+'</div>';
        const d=await api('/api/members?year='+CURRENT_YEAR);
        if(!d){ wrap.innerHTML='<div class="io-status err">'+t('no_data')+'</div>'; return; }
        window._pickAll=(d.members||d.rows||d||[]);
        if(!Array.isArray(window._pickAll)) window._pickAll=[];
        _pickChosen=new Set(window._bcIds||[]);
        wrap.innerHTML=
          '<div class="form-group"><label>'+t('pick_members')+'</label>'
            +'<input type="text" id="bcPickSearch" placeholder="'+t('pick_search')+'" '
              +'oninput="paintPicks()" autocomplete="off">'
            +'<div class="pick-grid tall" id="bcPickList"></div>'
            +'<small class="field-hint" id="bcPickCount"></small></div>';
        paintPicks();
    }

    function paintPicks(){
        const box=document.getElementById('bcPickList');
        if(!box) return;
        const q=(document.getElementById('bcPickSearch')?.value||'').trim().toLowerCase();
        const rows=(window._pickAll||[]).filter(m=>{
            if(!q) return true;
            return [m.name,m.name_gu,m.member_code,m.mobile,m.center_name]
                .some(v=>(v||'').toString().toLowerCase().includes(q));
        }).slice(0,400);
        box.innerHTML=rows.length?rows.map(m=>
          '<label class="yp"><input type="checkbox" value="'+m.id+'" '
            +(_pickChosen.has(m.id)?'checked':'')+' onchange="togglePick('+m.id+',this.checked)"> '
            +'<span>'+esc(m.name)+(m.member_code?' <small class="text-muted">'+esc(m.member_code)+'</small>':'')
            +'</span></label>').join('')
          :'<div class="text-muted py-4 text-center">'+t('no_members')+'</div>';
        const c=document.getElementById('bcPickCount');
        if(c) c.textContent=t('n_picked').replace('{n}',_pickChosen.size);
    }

    function togglePick(id,on){
        if(on) _pickChosen.add(id); else _pickChosen.delete(id);
        const c=document.getElementById('bcPickCount');
        if(c) c.textContent=t('n_picked').replace('{n}',_pickChosen.size);
    }

    // Only templates meant for the chosen channel.
    function bcTemplates(){
        const ch=document.getElementById('fBcChannel')?.value;
        const sel=document.getElementById('fBcTemplate');
        if(!sel) return;
        const list=(window._tpls||[]).filter(x=>x.is_active&&(x.channel===ch||x.channel==='any'));
        sel.innerHTML=list.map(x=>'<option value="'+x.id+'">'+esc(tplName(x))+'</option>').join('')
          ||'<option value="">'+t('no_data')+'</option>';
        document.getElementById('bcPreview').innerHTML='';
    }

    function bcPayload(){
        const y=yearsFrom('bc');
        const scope=document.getElementById('fBcScope').value;
        // A hand-picked list is sent as ids with the scope opened right up,
        // so nothing filters the chosen people back out again.
        const ids=(scope==='selected')
            ? [..._pickChosen]
            : (window._bcIds||undefined);
        return {
            channel:document.getElementById('fBcChannel').value,
            template_id:parseInt(document.getElementById('fBcTemplate').value),
            scope:(scope==='selected'?'all':scope),
            pujan_year:CURRENT_YEAR,
            years:y.years, all_years:y.all_years,
            member_ids:(ids&&ids.length)?ids:undefined
        };
    }

    // Nothing picked means nothing to send, and "scope: all" would otherwise
    // quietly message the whole centre.
    function bcPickedOk(){
        if(document.getElementById('fBcScope')?.value!=='selected') return true;
        if(_pickChosen.size) return true;
        toast(t('pick_none'),'error');
        return false;
    }

    async function bcPreview(){
        if(!bcPickedOk()) return;
        const d=await api('/api/communicate/preview','POST',bcPayload());
        if(!d) return;
        document.getElementById('bcPreview').innerHTML=
          '<div class="io-status">'+t('reachable').replace('{n}',d.reachable).replace('{t}',d.total)+'</div>'
          +(d.without_contact?'<div class="io-status bad"><i class="fas fa-triangle-exclamation"></i> '
            +t('no_contact_note').replace('{n}',d.without_contact)+'</div>':'')
          +(d.sample?'<div class="msg-preview">'
              +(d.sample.subject?'<div class="msg-subject">'+esc(d.sample.subject)+'</div>':'')
              +'<pre class="msg-body">'+esc(d.sample.body)+'</pre></div>':'');
    }

    async function bcSend(){
        if(!bcPickedOk()) return;
        const p=bcPayload();
        if(!p.template_id){ toast(t('no_data'),'error'); return; }
        const res=await api('/api/communicate','POST',p);
        if(!res) return;
        toast(t('comm_sent').replace('{n}',res.queued));
        if(res.links&&res.links.length){
            // WhatsApp cannot send unattended, so the links are handed over.
            document.getElementById('bcPreview').innerHTML=
              '<div class="io-status"><i class="fas fa-circle-info"></i> '+t('wa_links_note')+'</div>'
              +'<div class="wa-links">'+res.links.map(l=>'<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="'
                +esc(l.url)+'"><i class="fab fa-whatsapp"></i> '+esc(l.member)+'</a>').join('')+'</div>';
        } else {
            if(res.note) document.getElementById('bcPreview').innerHTML=
              '<div class="io-status"><i class="fas fa-circle-info"></i> '+esc(res.note)+'</div>';
            else closeModal();
        }
    }

    // ---- Focus mode -------------------------------------------------
    // Fills the screen with just the scanner and the keypad. On a phone it
    // also asks the browser for real fullscreen, which is the only way to get
    // rid of the address bar.
    let _focusOn=false;
    async function toggleCheckinFocus(force){
        const want = (force===undefined) ? !_focusOn : !!force;
        _focusOn = want;
        document.body.classList.toggle('checkin-focus', want);
        const b=document.getElementById('focusBtn');
        if(b) b.innerHTML = want
            ? '<i class="fas fa-compress"></i> '+t('exit_focus')
            : '<i class="fas fa-expand"></i> '+t('focus_mode');
        try{
            if(want && document.documentElement.requestFullscreen && !document.fullscreenElement){
                await document.documentElement.requestFullscreen({navigationUI:'hide'});
            } else if(!want && document.fullscreenElement && document.exitFullscreen){
                await document.exitFullscreen();
            }
        }catch(err){ /* fullscreen refused: the layout still fills the page */ }
        // The camera view has to be re-measured at the new size.
        if(want && _scanner) setTimeout(()=>{ restartScanner(); }, 220);
    }

    // Leaving fullscreen by the system back gesture should leave focus mode.
    document.addEventListener('fullscreenchange',()=>{
        if(!document.fullscreenElement && _focusOn) toggleCheckinFocus(false);
    });

    async function restartScanner(){
        if(!_scanner) return;
        try{ await _scanner.stop(); }catch(e){}
        _scanner=null;
        await toggleScanner();
    }

    // On-screen keypad. The field is inputmode="none" so the phone's own
    // keyboard never opens and covers the scanner.
    // Press and hold the backspace key to clear the whole number.
    let _padHold=null;
    document.addEventListener('pointerdown',e=>{
        const k=e.target.closest('.pad-del');
        if(!k)return;
        _padHold=setTimeout(()=>{
            _padHold=null;
            const f=document.getElementById('checkinPass');
            if(f){ f.value=''; peekPass(); }
            if(navigator.vibrate) navigator.vibrate(30);
        },450);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>
        document.addEventListener(ev,()=>{ clearTimeout(_padHold); }));

    function padPress(k){
        const f=document.getElementById('checkinPass');
        if(!f)return;
        if(k==='back')      f.value=f.value.slice(0,-1);
        else if(k==='clear') f.value='';
        else                f.value+=k;
        peekPass();
        f.focus({preventScroll:true});
    }

    // A physical keyboard still works: digits, letters, Backspace and Enter.
    function padKeyboard(e){
        if(e.key==='Enter'){ e.preventDefault(); checkIn(e); return; }
        const f=e.target;
        if(e.key==='Backspace'){ e.preventDefault(); f.value=f.value.slice(0,-1); peekPass(); return; }
        if(e.key.length===1 && /[0-9A-Za-z]/.test(e.key)){
            e.preventDefault(); f.value+=e.key.toUpperCase(); peekPass();
        }
    }

    let _checkinBusy=false, _verdictTimer=null;

    async function checkIn(e){
        if(e&&e.preventDefault) e.preventDefault();
        if(_checkinBusy) return;                  // one at a time
        const field=document.getElementById('checkinPass');
        const pn=field.value.trim().toUpperCase();
        const year=document.getElementById('filterYear')?.value||CURRENT_YEAR;
        const box=document.getElementById('checkinResult');
        if(!pn) return;
        _checkinBusy=true;
        field.value=''; field.focus({preventScroll:true});
        const peek=document.getElementById('passPeek');
        if(peek){peek.innerHTML='';peek.className='pass-peek';}
        clearTimeout(_verdictTimer);
        // quiet: the verdict panel below carries the message, so a toast on
        // top of the scanner would be the same failure said twice.
        if(_darshanMode){ await darshanScan(pn, parseInt(year), box); _checkinBusy=false; return; }
        const res=await api('/api/attendance/checkin','POST',
            {pass_number:pn,pujan_year:parseInt(year)}, true);
        if(res){
            // Full-width green panel: readable at arm's length in a busy hall.
            box.className='checkin-verdict ok';
            // The seat number is what the volunteer reads out, so it leads.
            const seat=res.seat_label||'';
            box.innerHTML='<i class="fas fa-check-circle" aria-hidden="true"></i>'
              +(seat?'<div class="seat-badge"><small>'+t('seat_no')+'</small><b>'+esc(seat)+'</b></div>':'')
              +'<div><strong>'+esc(res.member)+'</strong><span>'+t('attendance_marked')
                +' &bull; '+esc(res.attendance.pass_number)+'</span></div>'
              +(res.can_print&&res.attendance
                 ?'<button type="button" class="btn btn-sm btn-outline slip-btn" onclick="printSlip('+res.attendance.id+')">'
                   +'<i class="fas fa-print"></i> '+t('print_slip')+'</button>':'');
            // Prepend the new row instead of re-rendering the page, which used
            // to wipe this confirmation half a second after it appeared.
            const tb=document.querySelector('#pageBody table.table tbody');
            if(tb){
                const tr=document.createElement('tr'); tr.className='row-new';
                // Seven cells, matching the header. Two were missing, so a
                // freshly checked-in row sat one column short until the page
                // was reloaded.
                tr.innerHTML='<td data-label="#">1</td>'
                  +'<td class="mid" data-label="'+t('seat_no')+'">'+seatCell(res.attendance)+'</td>'
                  +'<td data-label="'+t('pass_number')+'"><strong>'+esc(res.attendance.pass_number)+'</strong></td>'
                  +'<td data-label="'+t('member_id')+'"><span class="mem-code-cell">'+esc(res.attendance.member_code||'')+'</span></td>'
                  +'<td data-label="'+t('member_label')+'">'+esc(res.attendance.member_name)+'</td>'
                  +'<td data-label="'+t('center')+'">'+esc(res.attendance.center_name)+'</td>'
                  +'<td data-label="'+t('checkin_time')+'">'+esc(res.attendance.check_in_time)+'</td>';
                if(tb.querySelector('td[colspan]')) tb.innerHTML='';
                tb.prepend(tr);
            }
        } else {
            // The real reason, not a generic "not checked in".
            box.className='checkin-verdict fail';
            box.innerHTML='<i class="fas fa-times-circle" aria-hidden="true"></i>'
              +'<div><strong>'+esc(pn)+'</strong><span>'
                +esc(api.lastError||t('checkin_failed'))+'</span></div>';
        }
        _checkinBusy=false;
        // The verdict clears itself, so the screen is ready for the next
        // person without anyone having to dismiss anything.
        clearTimeout(_verdictTimer);
        _verdictTimer=setTimeout(()=>{
            const b=document.getElementById('checkinResult');
            if(b){ b.innerHTML=''; b.className=''; }
        }, 4000);
    }

    async function saveRole(e,id){
        e.preventDefault();
        const data={
            name:document.getElementById('fRoleName').value.trim(),
            name_gu:document.getElementById('fRoleNameGu').value.trim(),
            description:document.getElementById('fRoleDesc').value.trim(),
            center_scoped:document.getElementById('fRoleScoped').checked
        };
        if(!id) data.permissions={};                  // rights are set next
        const res=id?await api('/api/roles/'+id,'PUT',data):await api('/api/roles','POST',data);

            closeModal(); toast(t('saved')); _roleCache=null; await loadRoles();

        }

    async function showRolePerms(id){

            _permCat?Promise.resolve(_permCat):api('/api/permissions'),
            _roleCache?Promise.resolve(_roleCache):api('/api/roles')]);

    function permBody(){

            +'<button type="button" class="btn-chip" onclick="permGroupAll(\''+g.key+'\',true)">'+t('all_on')+'</button>'

          +'<div class="perm-grid">'

              const on=!!_permState[it.key];

                +'<span class="switch"><input type="checkbox" '+(on?'checked':'')+' onchange="permSet(\''+it.key+'\',this.checked)"><span class="slider"></span></span>'
